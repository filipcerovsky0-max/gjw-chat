<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rozšiř to! - GJW Portál</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body {
            background-color: #f0f0f0;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            margin: 15px;
            padding: 10px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            box-sizing: border-box;
        }
        .stred { text-align: center; }
        .oddeleni { border: 0; height: 1px; background: #ccc; margin: 20px 0; }
        #nadpis { font-size: 18px; font-weight: bold; margin: 15px 0 8px 0; color: #000000; }
        .tady { font-size: 12px; color: #333; margin: 4px 0 12px 0; line-height: 1.5; }
        
        .designs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .design-card {
            background: #fff;
            border: 1px solid #b0b0a8;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .design-card:hover { border-color: #0000EE; }
        .design-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border: 1px solid #ddd;
        }
        .design-title {
            font-size: 12px;
            font-weight: bold;
            margin-top: 6px;
        }

        #modalOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: #fff;
            border: 2px solid #333;
            max-width: 600px;
            width: 100%;
            padding: 15px;
            position: relative;
            box-sizing: border-box;
            text-align: center;
        }
        .modal-header-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 10px;
        }
        .action-btn {
            background: #e2e8f0;
            border: 1px solid #94a3b8;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            color: #000;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border-radius: 3px;
        }
        .action-btn:hover { background: #cbd5e1; }
        .close-btn { background: #ffcccc; border-color: #ff9999; color: #990000; }
        .modal-img {
            max-width: 100%;
            max-height: 70vh;
            display: block;
            margin: 0 auto;
            border: 1px solid #ccc;
        }
        a { color: #0000EE; text-decoration: underline; }
    </style>
</head>
<body>
    <p><a href="../">&laquo; Zpět na hlavní stránku</a></p>
    <hr class="oddeleni">

    <h1 id="nadpis">📢 Rozšiř to!</h1>
    <p class="tady">Studentstvo se nesmí nechat utlačovat propagandou GJW, a proto si najdi design, který se ti líbí, a rozšiř ho buď postem na sociálních sítích, či fyzickým tiskem (kdo ho vylepí v ředitelně, dostává zlatého Bálinťáka).</p>
    
    <div id="designsGridContainer" class="designs-grid">
        <p class="tady italic text-gray-500" id="loadingText">Načítám designy...</p>
    </div>

    <!-- Modální okno -->
    <div id="modalOverlay">
        <div class="modal-content">
            <div class="modal-header-actions">
                <a id="modalDownloadBtn" href="#" download="gjw-design.png" class="action-btn" title="Stáhnout obrázek">📥 Stáhnout</a>
                <button onclick="printImage()" class="action-btn" title="Vytisknout obrázek">🖨️ Vytisknout</button>
                <button onclick="closeModal()" class="action-btn close-btn">✕ Zavřít</button>
            </div>
            <img id="modalImage" class="modal-img" src="" alt="Zvětšený design">
            <div id="modalTitle" style="font-weight: bold; margin-top: 10px; font-size: 13px;"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://gjw-chat-default-rtdb.europe-west1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('promoDesigns').on('value', (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('designsGridContainer');
            container.innerHTML = '';

            if (!data) {
                container.innerHTML = '<p class="tady italic text-gray-500">Zatím nebyly nahrány žádné designy přes administraci.</p>';
                return;
            }

            Object.entries(data).reverse().forEach(([key, item]) => {
                const card = document.createElement('div');
                card.className = "design-card";
                card.onclick = () => openModal(item.image, item.title);
                
                // Pokud je název prázdný, titulek pod fotkou vůbec nevykreslíme
                const titleHtml = item.title ? `<div class="design-title">${item.title}</div>` : '';

                card.innerHTML = `
                    <img src="${item.image}" alt="${item.title || 'Design'}">
                    ${titleHtml}
                `;
                container.appendChild(card);
            });
        });

        function openModal(imgSrc, title) {
            const overlay = document.getElementById('modalOverlay');
            const modalImg = document.getElementById('modalImage');
            const downloadBtn = document.getElementById('modalDownloadBtn');
            const modalTitle = document.getElementById('modalTitle');

            modalImg.src = imgSrc;
            downloadBtn.href = imgSrc;
            modalTitle.innerText = title || '';
            overlay.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function printImage() {
            const imgSrc = document.getElementById('modalImage').src;
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                    <head>
                        <title></title>
                        <style>
                            @page {
                                size: landscape;
                                margin: 0;
                            }
                            body {
                                margin: 0;
                                display: flex;
                                justify-content: center;
                                align-items: center;
                                height: 100vh;
                                background: white;
                            }
                            img {
                                max-width: 100%;
                                max-height: 100vh;
                                object-fit: contain;
                            }
                        </style>
                    </head>
                    <body>
                        <img src="${imgSrc}" onload="window.print();window.close();"/>
                    </body>
                </html>
            `);
            printWindow.document.close();
        }

        window.onclick = function(event) {
            const overlay = document.getElementById('modalOverlay');
            if (event.target === overlay) {
                closeModal();
            }
        }
    </script>
</body>
</html>
