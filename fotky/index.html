<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotky učitelů - GJW</title>
    <meta content="#D5D8DC" data-react-helmet="true" name="theme-color"/>
    <style>
        body {
            background-color: #f0f0f0;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            margin: 15px;
            padding: 10px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            box-sizing: border-box;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            margin-top: 20px;
        }
        .photo-box {
            text-align: center;
            max-width: 300px;
        }
        .photo-box img {
            max-width: 100%;
            height: auto;
            max-height: 280px;
            display: block;
            border-radius: 2px;
        }
        .photo-title {
            font-size: 15px;
            font-weight: bold;
            color: #222;
            margin: 8px 0 0 0;
            font-family: 'Papyrus', fantasy, 'Comic Sans MS', cursive, sans-serif;
        }
        .back-link {
            color: #0000EE;
            text-decoration: none;
            font-size: 13px;
            display: inline-block;
            margin-bottom: 15px;
            font-family: 'Papyrus', fantasy, sans-serif;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .stred { 
            text-align: center; 
            color: #666; 
            font-size: 15px; 
            font-family: 'Papyrus', fantasy, sans-serif;
        }
    </style>
</head>
<body>
    <!-- Skrytý audio přehrávač -->
    <audio id="pozadiHudba" src="hudba.mp3" loop autoplay></audio>

    <a class="back-link" href="../">&laquo; Zpět na hlavní stránku</a>
    
    <div id="galerie" class="gallery">
        <p class="stred">Načítám fotky...</p>
    </div>

    <script>
        // Ošetření spuštění hudby pro moderní prohlížeče a mobily
        const audio = document.getElementById('pozadiHudba');
        audio.volume = 0.5;
        let playPromise = audio.play();
        if (playPromise !== undefined) {
            playPromise.catch(() => {
                window.addEventListener('click', () => {
                    audio.play();
                }, { once: true });
            });
        }

        const seznamFotek = [
            { soubor: "zalud.png", nazev: "žaLUD" },
            { soubor: "1+1=2.jpeg", nazev: "1 + 1 = 2" },
            { soubor: "cold asf.jpg", nazev: "cold asf" },
            { soubor: "coldjpg.jpg", nazev: "studene" },
            { soubor: "hlav.png", nazev: "der Führer" },
            { soubor: "idk co tu dela.jpg", nazev: "idk co tu dela" },
            { soubor: "je v katakombach.jpg", nazev: "je v katakombach" },
            { soubor: "marion.png", nazev: "Je m´apelle Bernard" },
            { soubor: "odpocivej v pokoji.jpeg", nazev: "odpocivej v pokoji" },
            { soubor: "sedlak.jpg", nazev: "sedlak" },
            { soubor: "skryta identita odhalena.png", nazev: "skryta identita odhalena" },
            { soubor: "subirovjpg.jpg", nazev: "subirov" },
            { soubor: "taky v katakombach.jpg", nazev: "bracho co tu delas" }
        ];

        function nactiGalerii() {
            const galerieDiv = document.getElementById('galerie');
            galerieDiv.innerHTML = "";

            if (seznamFotek.length === 0) {
                galerieDiv.innerHTML = '<p class="stred">Zatím tu nejsou žádné fotky.</p>';
                return;
            }

            seznamFotek.forEach(foto => {
                const box = document.createElement('div');
                box.className = 'photo-box';
                box.innerHTML = `
                    <img src="${foto.soubor}" alt="${foto.nazev}">
                    <p class="photo-title">${foto.nazev}</p>
                `;
                galerieDiv.appendChild(box);
            });
        }

        nactiGalerii();
    </script>
</body>
</html>
