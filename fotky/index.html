<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fotecky uciteliku</title>
    <meta content="#D5D8DC" data-react-helmet="true" name="theme-color"/>
    <style>
        body {
            background-color: #f0f0f0;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            margin: 15px;
            padding: 10px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            box-sizing: border-box;
            user-select: none;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            margin-top: 20px;
        }
        .photo-box {
            text-align: center;
            max-width: 300px;
        }
        .image-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }
        .photo-box img {
            max-width: 100%;
            height: auto;
            max-height: 280px;
            display: block;
            border-radius: 2px;
        }
        .photo-title {
            font-size: 15px;
            font-weight: bold;
            color: #222;
            margin: 8px 0 0 0;
            font-family: 'Papyrus', fantasy, 'Comic Sans MS', cursive, sans-serif;
        }
        .back-link {
            color: #0000EE;
            text-decoration: none;
            font-size: 13px;
            display: inline-block;
            margin-bottom: 15px;
            font-family: 'Papyrus', fantasy, sans-serif;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .stred { 
            text-align: center; 
            color: #666; 
            font-size: 15px; 
            font-family: 'Papyrus', fantasy, sans-serif;
        }
        .like-counter {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
            pointer-events: none;
            backdrop-filter: blur(2px);
        }
        .heart-animation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 70px;
            color: #ff3b30;
            pointer-events: none;
            transition: transform 0.2s ease-in-out, opacity 0.2s ease-in-out;
            opacity: 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .heart-animation.show {
            transform: translate(-50%, -50%) scale(1.2);
            opacity: 1;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <!-- Skrytý audio přehrávač -->
    <audio id="pozadiHudba" src="hudba.mp3" loop autoplay></audio>

    <a class="back-link" href="../">&laquo; Zpět na hlavní stránku</a>
    
    <div id="galerie" class="gallery">
        <p class="stred">Načítám fotky...</p>
    </div>

    <script>
        const audio = document.getElementById('pozadiHudba');
        audio.volume = 0.5;
        let playPromise = audio.play();
        if (playPromise !== undefined) {
            playPromise.catch(() => {
                window.addEventListener('click', () => {
                    audio.play();
                }, { once: true });
            });
        }

        const firebaseConfig = { databaseURL: "https://gjw-chat-default-rtdb.europe-west1.firebasedatabase.app" };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Záložní výchozí fotky pro případ, že je databáze prázdná
        const pùvodniFotky = [
            { soubor: "zalud.png", nazev: "žaLUD", likes: 0 },
            { soubor: "1+1=2.jpeg", nazev: "1 + 1 = 2", likes: 0 },
            { soubor: "cold asf.jpg", nazev: "cold asf", likes: 0 },
            { soubor: "coldjpg.jpg", nazev: "studene", likes: 0 },
            { soubor: "hlav.png", nazev: "der Führer", likes: 0 },
            { soubor: "idk co tu dela.jpg", nazev: "idk co tu dela", likes: 0 },
            { soubor: "je v katakombach.jpg", nazev: "je v katakombach", likes: 0 },
            { soubor: "marion.png", nazev: "Je m´apelle Bernard", likes: 0 },
            { soubor: "odpocivej v pokoji.jpeg", nazev: "odpocivej v pokoji", likes: 0 },
            { soubor: "sedlak.jpg", nazev: "sedlak", likes: 0 },
            { soubor: "skryta identita odhalena.png", nazev: "skryta identita odhalena", likes: 0 },
            { soubor: "subirovjpg.jpg", nazev: "subirov", likes: 0 },
            { soubor: "taky v katakombach.jpg", nazev: "bracho co tu delas", likes: 0 }
        ];

        db.ref('fotky').once('value', (snapshot) => {
            if (!snapshot.exists()) {
                // Pokud ve Firebase nic není, automaticky to tam nahrajeme
                pùvodniFotky.forEach(foto => {
                    db.ref('fotky').push(foto);
                });
            }
        });

        // Živé poslouchání dat z Firebase
        db.ref('fotky').on('value', (snapshot) => {
            const galerieDiv = document.getElementById('galerie');
            galerieDiv.innerHTML = "";

            const data = snapshot.val();
            if (!data) {
                galerieDiv.innerHTML = '<p class="stred">Zatím tu nejsou žádné fotky.</p>';
                return;
            }

            Object.entries(data).forEach(([key, foto]) => {
                const box = document.createElement('div');
                box.className = 'photo-box';
                
                const likesCount = foto.likes || 0;
                const nazev = foto.nazev || 'Bez názvu';
                const soubor = foto.soubor || '';

                box.innerHTML = `
                    <div class="image-wrapper" data-key="${key}">
                        <img src="${soubor}" alt="${nazev}">
                        <div class="like-counter">❤️ <span>${likesCount}</span></div>
                        <div class="heart-animation">❤️</div>
                    </div>
                    <p class="photo-title">${nazev}</p>
                `;

                const wrapper = box.querySelector('.image-wrapper');
                const heart = box.querySelector('.heart-animation');
                let lastClickTime = 0;

                wrapper.addEventListener('click', (e) => {
                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastClickTime;
                    
                    if (tapLength < 300 && tapLength > 0) {
                        heart.classList.add('show');
                        setTimeout(() => {
                            heart.classList.remove('show');
                        }, 800);

                        db.ref(`fotky/${key}/likes`).transaction((currentLikes) => {
                            return (currentLikes || 0) + 1;
                        });

                        e.preventDefault();
                    }
                    lastClickTime = currentTime;
                });

                galerieDiv.appendChild(box);
            });
        });
    </script>
</body>
</html>
