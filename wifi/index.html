<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jak je na tom dnes skolni wifi? - GJW</title>
    <meta content="#D5D8DC" data-react-helmet="true" name="theme-color"/>
    <style>
        body {
            background-color: #f0f0f0;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            margin: 15px;
            padding: 10px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            box-sizing: border-box;
            user-select: none;
        }
        .stred { text-align: center; }
        .oddeleni { border: 0; height: 1px; background: #ccc; margin: 20px 0; }
        h1 { font-size: 20px; font-weight: bold; margin: 15px 0; color: #000000; }
        p { font-size: 14px; line-height: 1.5; color: #333; }
        .back-link { color: #0000EE; text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 15px; }
        .back-link:hover { text-decoration: underline; }
        
        .wifi-box {
            background: #fff;
            border: 1px solid #b0b0a8;
            padding: 25px;
            border-radius: 6px;
            margin: 20px 0;
            text-align: center;
        }
        .wifi-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
            text-align: left;
            background: #f8fafc;
            padding: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
        }
        .info-item {
            font-size: 14px;
        }
        .info-item strong {
            color: #1e293b;
        }
        .hlaska-box {
            background: #fff8c5;
            border: 1px solid #e2d27f;
            border-left: 5px solid #d4b126;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            font-family: 'Papyrus', fantasy, sans-serif;
            font-size: 16px;
            font-style: italic;
            color: #222;
        }
        .retro-button {
            background: #e2e8f0;
            border: 1px solid #94a3b8;
            padding: 8px 16px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: #000;
            border-radius: 3px;
            margin-top: 15px;
        }
        .retro-button:hover { background: #cbd5e1; }
    </style>
</head>
<body>
    <a class="back-link" href="../">&laquo; Zpět na hlavní stránku</a>
    <hr class="oddeleni">

    <div class="stred">
        <h1>Jak je na tom dnes skolni wifi? (spatne)</h1>
        <p>zkontroluj si jak rychla je dnes skolni wifi (pomala)</p>
    </div>

    <div class="wifi-box">
        <div id="wifiIcon" class="emoji wifi-icon">📶</div>
        <div id="statusText" style="font-size: 18px; font-weight: bold; margin-bottom: 10px;">Měřím rychlost a ping sítě...</div>
        
        <div class="info-grid">
            <div class="info-item"><strong>Signál (čárky):</strong> <span id="wifiBars">Zjišťuji...</span></div>
            <div class="info-item"><strong>Odezva (Ping):</strong> <span id="wifiPing">Zjišťuji...</span></div>
            <div class="info-item" style="grid-column: span 2;"><strong>Stav:</strong> <span id="wifiStatusState">Testování...</span></div>
        </div>

        <div id="hlaskaContainer" class="hlaska-box" style="display: none;">
            <span id="wifiHlaska"></span>
        </div>

        <button onclick="zmeritWifi()" class="retro-button">Spustit test znovu</button>
    </div>

    <hr class="oddeleni">
    <p style="font-size: 11px; color: #666; text-align: center;">Copyright © 2026 Gymnázium Jiřího Wolkera. Všechna práva ukradena.</p>

    <script>
        const hlaskyPodlePingu = [
            "(Až podezřele dobrý): hele radsi si zkontroluj jestli nemas zaply data todle nenik rychlost gjw wifi",
            "(Celkem to jde): proste normalka no",
            "(Průměrná bída): normalka pro skolni wifi nic extra ale jeste to nejak funguje",
            "(Tragédie): jakoze nacist stranku trva jak prijit Opavske do hodiny",
            "(Úplnej konec): tak ja absolutne netusim jak si nacetl tudle stranku s toudle wifinou"
        ];

        async function zmeritWifi() {
            document.getElementById('statusText').innerText = "Měřím rychlost a ping sítě...";
            document.getElementById('wifiBars').innerText = "Zjišťuji...";
            document.getElementById('wifiPing').innerText = "Zjišťuji...";
            document.getElementById('wifiStatusState').innerText = "Měření...";
            document.getElementById('hlaskaContainer').style.display = 'none';

            let startTime = performance.now();
            let ping = 0;

            try {
                await fetch('../favicon.ico?' + new Date().getTime(), { mode: 'no-cors', cache: 'no-store' });
                let endTime = performance.now();
                ping = Math.round(endTime - startTime);
            } catch (e) {
                ping = Math.floor(Math.random() * 400) + 300;
            }

            let carek = "📶 4/4";
            let hlaskaIndex = 0;

            if (ping < 50) {
                carek = "📶 4/4 (Plný signál)";
                hlaskaIndex = 0;
            } else if (ping < 120) {
                carek = "📶 3/4 (Dobrý)";
                hlaskaIndex = 1;
            } else if (ping < 250) {
                carek = "📶 2/4 (Kolísá)";
                hlaskaIndex = 2;
            } else if (ping < 500) {
                carek = "📶 1/4 (Slabý)";
                hlaskaIndex = 3;
            } else {
                carek = "❌ 0/4 (Mrtvo)";
                hlaskaIndex = 4;
            }

            document.getElementById('wifiBars').innerText = carek;
            document.getElementById('wifiPing').innerText = ping + " ms";
            document.getElementById('wifiStatusState').innerText = (ping > 300) ? "tak wifi je v prdeli" : "Stabilní (zatím)";
            document.getElementById('statusText').innerText = "Výsledek diagnostiky školní sítě:";
            
            document.getElementById('wifiHlaska').innerText = hlaskyPodlePingu[hlaskaIndex];
            document.getElementById('hlaskaContainer').style.display = 'block';
        }

        window.onload = zmeritWifi;
    </script>
</body>
</html>
