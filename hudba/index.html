<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hudební koutek - GJW</title>
    <meta content="#D5D8DC" data-react-helmet="true" name="theme-color"/>
    <meta name="description" content="Hudební koutek pro studenty GJW">
    <style>
        body {
            background-color: #f0f0f0;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            margin: 15px;
            padding: 10px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            box-sizing: border-box;
        }
        .stred { text-align: center; }
        .oddeleni { border: 0; height: 1px; background: #ccc; margin: 20px 0; }
        h1 { font-size: 20px; font-weight: bold; margin: 15px 0; color: #000000; }
        p { font-size: 14px; line-height: 1.5; color: #333; }
        .back-link { color: #0000EE; text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 15px; }
        .back-link:hover { text-decoration: underline; }
        .music-box {
            background: #fff;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
            text-align: center;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <a class="back-link" href="../">&laquo; Zpět na hlavní stránku</a>
    <hr class="oddeleni">

    <div class="stred">
        <h1>🎵 Hudební koutek</h1>
        <p>Poslouchej písničky, lepší než poslouchat učitele</p>
    </div>

    <hr class="oddeleni">

    <!-- Seznam písniček -->
    <div id="seznam-pisnicek">
        <p class="stred" style="color: #666;">Načítám písničky z repozitáře...</p>
    </div>

    <hr class="oddeleni">
    <p style="font-size: 11px; color: #666; text-align: center;">Copyright © 2026 Gymnázium Jiřího Wolkera. Všechna práva ukradena.</p>

    <script>
        async function nactiHudbuZGitHubu() {
            const playlistDiv = document.getElementById('seznam-pisnicek');
            
            // GitHub API pro tvojí složku 'hudba' v repozitáři
            // (Zadej svůj GitHub uživatelský/organizační účet a název repozitáře, např. 'FilipCerovsky/gjw-chat')
            const owner = "FilipCerovsky"; // <--- Tady si zkontroluj svůj GitHub uživatelský účet
            const repo = "gjw-chat";       // <--- Tady si zkontroluj název repozitáře
            const path = "hudba";

            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error("Nepodařilo se načíst obsah ze složky.");
                }
                
                const files = await response.json();
                
                // Vyfiltruje pouze MP3 soubory
                const mp3Files = files.filter(file => file.type === 'file' && file.name.toLowerCase().endsWith('.mp3'));

                playlistDiv.innerHTML = "";

                if (mp3Files.length === 0) {
                    playlistDiv.innerHTML = '<p class="stred">Ve složce hudba zatím nejsou žádné MP3 soubory.</p>';
                    return;
                }

                mp3Files.forEach(file => {
                    // Pěkně formátovaný název (odstraní příponu .mp3 a nahradí pomlčky/podtržítka mezerami)
                    const cleanName = file.name.replace(/\.mp3$/i, '').replace(/[-_]/g, ' ');
                    
                    const box = document.createElement('div');
                    box.className = 'music-box';
                    box.innerHTML = `
                        <p><b>🎵 ${cleanName}</b></p>
                        <audio controls preload="metadata">
                            <source src="${file.download_url}" type="audio/mp3">
                            Tvůj prohlížeč nepodporuje přehrávání audio souborů.
                        </audio>
                    `;
                    playlistDiv.appendChild(box);
                });

            } catch (error) {
                // Pokud by GitHub API zlobilo (např. limit požadavků), uděláme fallback na přímé zkoušení souboru, který známe
                playlistDiv.innerHTML = `
                    <div class="music-box">
                        <p><b>🎵 Chodím</b></p>
                        <audio controls preload="metadata">
                            <source src="chodim.mp3" type="audio/mp3">
                            Tvůj prohlížeč nepodporuje přehrávání audio souborů.
                        </audio>
                    </div>
                `;
            }
        }

        nactiHudbuZGitHubu();
    </script>
</body>
</html>
