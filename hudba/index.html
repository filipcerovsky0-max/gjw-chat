<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hudební koutek - GJW</title>
    <meta content="#D5D8DC" data-react-helmet="true" name="theme-color"/>
    <meta name="description" content="Hudební koutek pro studenty GJW">
    <style>
        body {
            background-color: #f0f0f0;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            margin: 15px;
            padding: 10px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            box-sizing: border-box;
        }
        .stred { text-align: center; }
        .oddeleni { border: 0; height: 1px; background: #ccc; margin: 20px 0; }
        h1 { font-size: 20px; font-weight: bold; margin: 15px 0; color: #000000; }
        p { font-size: 14px; line-height: 1.5; color: #333; }
        .back-link { color: #0000EE; text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 15px; }
        .back-link:hover { text-decoration: underline; }
        .music-box {
            background: #fff;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
            text-align: center;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <a class="back-link" href="../">&laquo; Zpět na hlavní stránku</a>
    <hr class="oddeleni">

    <div class="stred">
        <h1>Hudební koutek</h1>
        <p>Poslouchej pisnicky, lepsejsi nez poslouchat ucitele (zrada porozumis pak)</p>
    </div>

    <hr class="oddeleni">

    <!-- Seznam písniček -->
    <div id="seznam-pisnicek"></div>

    <hr class="oddeleni">
    <p style="font-size: 11px; color: #666; text-align: center;">Copyright © 2026 Gymnázium Jiřího Wolkera. Všechna práva ukradena.</p>

    <script>
        const mp3Files = [
            { name: "bum.mp3", title: "bum" },
            { name: "dej to nahlas delej.mp3", title: "dej to nahlas delej" },
            { name: "chodim.mp3", title: "chodim" },
            { name: "Marcand yapping.mp3", title: "Marcan yapping" },
            { name: "mongolské hrdelní zpěvy.mp3", title: "Mongolské hrdelní zpěvy" }
        ];

        const playlistDiv = document.getElementById('seznam-pisnicek');
        playlistDiv.innerHTML = "";

        mp3Files.forEach(file => {
            const box = document.createElement('div');
            box.className = 'music-box';
            
            box.innerHTML = `
                <p><b>${file.title}</b></p>
                <audio controls preload="metadata">
                    <source src="${file.name}" type="audio/mp3">
                    Tvůj prohlížeč nepodporuje přehrávání audio souborů.
                </audio>
            `;
            playlistDiv.appendChild(box);
        });
    </script>
</body>
</html>
