        const seznamDiv = document.getElementById('seznam-ucitelu');
        const statusDiv = document.getElementById('status');

        ucitele.forEach(ucitel => {
            const box = document.createElement('div');
            box.className = 'ucitel-box';
            
            box.innerHTML = `
                <div>
                    <div class="ucitel-jmeno">${ucitel.jmeno}</div>
                    <div class="ucitel-info">Počet: <span id="count-${ucitel.id}">0</span></div>
                </div>
                <button class="ucitel-btn" id="btn-${ucitel.id}" onclick="posliPozdrav('${ucitel.id}', '${ucitel.jmeno}', '${ucitel.email}')">${ucitel.jmeno}</button>
            `;
            seznamDiv.appendChild(box);

            // Živé načítání počtu z Firebase
            db.ref('pozdravy/' + ucitel.id).on('value', (snapshot) => {
                const data = snapshot.val();
                const pocet = data ? Object.keys(data).length : 0;
                document.getElementById(`count-${ucitel.id}`).innerText = pocet;
            });
        });

        function posliPozdrav(id, jmeno, email) {
            const btn = document.getElementById(`btn-${id}`);
            btn.innerText = "Anonymně odesláno";
            btn.disabled = true;
            btn.style.backgroundColor = "#555";

            db.ref('pozdravy/' + id).push({
                text: "Přeji krásný den",
                email: email,
                cas: Date.now()
            }).then(() => {
                statusDiv.style.color = "green";
                statusDiv.innerText = `Odesláno pro ${jmeno} (${email})`;
                setTimeout(() => { 
                    statusDiv.innerText = ""; 
                    btn.innerText = jmeno;
                    btn.disabled = false;
                    btn.style.backgroundColor = "#cc0000";
                }, 3000);
            }).catch((error) => {
                statusDiv.style.color = "red";
                statusDiv.innerText = `Chyba: ${error.message}`;
                btn.innerText = jmeno;
                btn.disabled = false;
                btn.style.backgroundColor = "#cc0000";
            });
        }
