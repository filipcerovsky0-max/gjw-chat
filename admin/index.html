<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gjw-chat - Ultra Admin Panel</title>
    <!-- Firebase SDK (v9 modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // Konfigurace Firebase (doplň své údaje z Firebase projektu)
        const firebaseConfig = {
            databaseURL: "https://gjw-chat-default-rtdb.europe-west1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Generování unikátního device fingerprintu
        window.getDeviceFingerprint = function() {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            const data = navigator.userAgent + navigator.language + screen.colorDepth + (gl ? gl.getParameter(gl.RENDERER) : '');
            let hash = 0;
            for (let i = 0; i < data.length; i++) {
                hash = ((hash << 5) - hash) + data.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash).toString(16);
        };

        // Přihlášení do admin menu
        document.addEventListener('DOMContentLoaded', () => {
            const loginBtn = document.getElementById('admin-login-btn');
            const passwordInput = document.getElementById('admin-password-input');
            const loginModal = document.getElementById('admin-login-modal');
            const adminMenu = document.getElementById('ultra-admin-menu');

            loginBtn.addEventListener('click', async () => {
                const inputVal = passwordInput.value;
                try {
                    const passRef = ref(db, 'admin/password');
                    const snapshot = await get(passRef);
                    
                    if (snapshot.exists() && snapshot.val() === inputVal) {
                        loginModal.style.display = 'none';
                        adminMenu.style.display = 'block';
                        window.isAdminAuthenticated = true;
                        alert('Úspěšně přihlášen do Ultra Admin Menu!');
                        initAdminPanelLogic(db);
                    } else {
                        alert('Nesprávné heslo!');
                    }
                } catch (err) {
                    console.error(err);
                    alert('Chyba při ověřování s Firebase databází.');
                }
            });
        });

        function initAdminPanelLogic(db) {
            // Rainbow Nick Toggle
            const rainbowToggle = document.getElementById('rainbow-nick-toggle');
            rainbowToggle.addEventListener('change', (e) => {
                if (e.target.checked) {
                    document.body.classList.add('rainbow-active');
                } else {
                    document.body.classList.remove('rainbow-active');
                }
            });

            // Ghost Mode Toggle
            const ghostToggle = document.getElementById('ghost-mode-toggle');
            ghostToggle.addEventListener('change', (e) => {
                window.isGhostMode = e.target.checked;
                console.log("Ghost mód aktivní:", window.isGhostMode);
            });
        }
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }

        /* Duhová animace pro Rainbow Nick */
        @keyframes rainbow {
            0% { color: red; }
            14% { color: orange; }
            28% { color: yellow; }
            42% { color: green; }
            57% { color: blue; }
            71% { color: indigo; }
            85% { color: violet; }
            100% { color: red; }
        }
        body.rainbow-active .my-nickname {
            animation: rainbow 3s infinite;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255,255,255,0.6);
        }

        /* Modální okno pro přihlášení */
        .admin-modal {
            max-width: 400px;
            margin: 100px auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            border: 1px solid #333;
            text-align: center;
        }
        .admin-modal input {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
        }
        .admin-modal button, .admin-panel button {
            background: #6200ee;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .admin-modal button:hover, .admin-panel button:hover {
            background: #7720ff;
        }

        /* Ultra Admin Menu */
            .admin-panel {
            max-width: 700px;
            margin: 20px auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            border: 1px solid #333;
        }
        .admin-panel h2 {
            margin-top: 0;
            color: #bb86fc;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .admin-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #252525;
            border-radius: 8px;
        }
        .admin-section h3 {
            margin-top: 0;
            font-size: 1.1em;
            color: #03dac6;
        }
        label {
            display: block;
            margin: 8px 0;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Přihlašovací okno -->
    <div id="admin-login-modal" class="admin-modal">
        <h2>sorry bro pouze pro adminstvo</h2>
        <p>netusim jaks to nasel bro</p>
        <input type="password" id="admin-password-input" placeholder="bohuzel potrebujes heslo">
        <br>
        <button id="admin-login-btn">Přihlásit se</button>
    </div>

    <!-- Ultra Admin Menu (zpočátku skryté) -->
    <div id="ultra-admin-menu" class="admin-panel" style="display: none;">
        <h2>⚡ Ultra Admin Menu</h2>

        <div class="admin-section">
            <span class="my-nickname">Ukázka přezdívky v chatu</span>
            <h3>🎮 Nastavení identity & režimů</h3>
            <label><input type="checkbox" id="rainbow-nick-toggle"> Duhový Nick (Rainbow)</label>
            <label><input type="checkbox" id="ghost-mode-toggle"> Ghost Mód (Neviditelný pozorovatel)</label>
        </div>

        <div class="admin-section">
            <h3>📁 Správa souborů a designů</h3>
            <input type="file" id="design-file-input" style="margin-bottom: 10px;">
            <br>
            <input type="text" id="rename-old-input" placeholder="Původní název souboru" style="padding: 6px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px;">
            <input type="text" id="rename-new-input" placeholder="Nový název souboru" style="padding: 6px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px;">
            <button id="rename-file-btn" style="margin-left: 5px;">Přejmenovat</button>
        </div>

        <div class="admin-section">
            <h3>🛡️ Moderace a tresty (podle Fingerprintu)</h3>
            <input type="text" id="target-fingerprint-input" placeholder="Fingerprint uživatele" style="width: 60%; padding: 6px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; margin-bottom: 10px;">
            <br>
            <button id="action-mute-btn" style="background: #fbc02d; color: black;">Mute (umlčet)</button>
            <button id="action-kick-btn" style="background: #f57c00;">Kick (vyhodit)</button>
            <button id="action-ban-btn" style="background: #d32f2f;">Ban (zablokovat)</button>
        </div>
    </div>

</body>
</html>
