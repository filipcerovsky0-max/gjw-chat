<!DOCTYPE html>
<html lang="cs" class="h-full bg-gray-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>co tu delas bracho todle je pro adminstvo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 14px; }
        .tab-btn.active { border-bottom: 2px solid #3b82f6; color: #1d4ed8; font-weight: bold; }
        .rainbow-admin { background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8fafc; }
    </style>
</head>
<body class="h-full flex flex-col">

    <!-- Login Screen -->
    <div id="loginScreen" class="fixed inset-0 bg-gray-900 z-50 flex flex-col items-center justify-center p-4">
        <div class="bg-white p-8 rounded shadow-2xl max-w-sm w-full space-y-4">
            <h2 class="text-2xl font-bold text-center text-gray-800">jaks to tu nasel!! to vubec neni pro tebe padej odsud</h2>
            <div>
                <label class="block text-sm font-bold mb-1">heslo poprosim</label>
                <input type="password" id="adminPassword" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="ha potrebujes heslo">
            </div>
            <button onclick="verifyLogin()" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">Přihlásit se</button>
            <p id="loginError" class="text-red-500 text-sm text-center hidden font-bold">Chybné heslo!</p>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="dashboardScreen" class="hidden flex-1 flex flex-col h-full">
        <header class="bg-gray-800 text-white p-4 flex justify-between items-center shadow-md shrink-0">
            <h1 class="text-xl font-bold rainbow-admin">GJW Ultra Admin Panel</h1>
            <div class="flex gap-4">
                <button onclick="enterChat('observed')" class="bg-green-600 px-3 py-1 rounded text-sm font-bold hover:bg-green-500">Vstoupit do Chatu (Viditelný)</button>
                <button onclick="enterChat('hidden')" class="bg-gray-600 px-3 py-1 rounded text-sm font-bold hover:bg-gray-500">Vstoupit do Chatu (Duch)</button>
                <button onclick="logoutAdmin()" class="bg-red-600 px-3 py-1 rounded text-sm font-bold hover:bg-red-500">Odhlásit</button>
            </div>
        </header>

        <nav class="bg-white border-b flex px-4 shrink-0 overflow-x-auto">
            <button onclick="switchTab('tab-chat')" class="tab-btn active px-4 py-3 hover:bg-gray-50 focus:outline-none">Moderace Zpráv</button>
            <button onclick="switchTab('tab-tresty')" class="tab-btn px-4 py-3 hover:bg-gray-50 focus:outline-none">Aktivní Tresty</button>
            <button onclick="switchTab('tab-piskvorky')" class="tab-btn px-4 py-3 hover:bg-gray-50 focus:outline-none">Piškvorky & Online Hráči</button>
            <button onclick="switchTab('tab-fotky')" class="tab-btn px-4 py-3 hover:bg-gray-50 focus:outline-none">Správa Fotek</button>
            <button onclick="switchTab('tab-hudba')" class="tab-btn px-4 py-3 hover:bg-gray-50 focus:outline-none">Správa Hudby</button>
            <button onclick="switchTab('tab-rozsir')" class="tab-btn px-4 py-3 hover:bg-gray-50 focus:outline-none">Správa Rozšiř To</button>
            <button onclick="switchTab('tab-memes')" class="tab-btn px-4 py-3 hover:bg-gray-50 focus:outline-none">Správa Memes</button>
        </nav>

        <main class="flex-1 overflow-y-auto p-6 bg-gray-100">
            <!-- TAB: Chaty -->
            <div id="tab-chat" class="tab-content">
                <h2 class="text-xl font-bold mb-4">Historie a Moderace Chatu</h2>
                <div class="bg-white rounded shadow overflow-hidden">
                    <table>
                        <thead><tr><th>Čas</th><th>Autor</th><th>Zpráva</th><th>Akce</th></tr></thead>
                        <tbody id="adminMessagesList"></tbody>
                    </table>
                </div>
            </div>

            <!-- TAB: Tresty -->
            <div id="tab-tresty" class="tab-content hidden">
                <h2 class="text-xl font-bold mb-4">Aktivní Bany a Muty</h2>
                <div class="bg-white rounded shadow overflow-hidden">
                    <table>
                        <thead><tr><th>Uživatel (ID)</th><th>Typ Trestu</th><th>Důvod</th><th>Vyprší</th><th>Akce</th></tr></thead>
                        <tbody id="adminRestrictionsList"></tbody>
                    </table>
                </div>
            </div>

            <!-- TAB: Piškvorky & Online Hráči -->
            <div id="tab-piskvorky" class="tab-content hidden space-y-6">
                <div>
                    <h2 class="text-xl font-bold mb-3 flex items-center gap-2">
                        <span>🎮 Právě probíhající Hry Piškvorek</span>
                        <span id="activeGamesBadge" class="bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full">0</span>
                    </h2>
                    <div class="bg-white rounded shadow overflow-hidden">
                        <table>
                            <thead>
                                <tr>
                                    <th>Hráč 1 (Symbol)</th>
                                    <th>VS</th>
                                    <th>
