<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temná stránka školy - GJW</title>
        
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body {
            background-color: #f0f0f0;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            margin: 15px;
            padding: 10px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            box-sizing: border-box;
        }
        .stred { text-align: center; }
        .oddeleni { border: 0; height: 1px; background: #ccc; margin: 20px 0; }
        #nadpis { font-size: 18px; font-weight: bold; margin: 15px 0 8px 0; color: #000000; }
        .tady { font-size: 12px; color: #333; margin: 4px 0 12px 0; line-height: 1.5; }
        .retro-box { background: #ffffff; border: 1px solid #b0b0a8; padding: 12px; margin-bottom: 15px; }
        .retro-button {
            background: #e2e8f0; border: 1px solid #94a3b8; padding: 5px 12px;
            font-family: Arial, sans-serif; font-size: 12px; cursor: pointer; color: #000; border-radius: 3px;
        }
        .retro-button:hover { background: #cbd5e1; }
        .retro-input {
            background: #ffffff; border: 1px solid #94a3b8; padding: 6px;
            font-family: Arial, sans-serif; font-size: 12px; color: #000; border-radius: 3px; width: 100%; box-sizing: border-box; margin-bottom: 8px;
        }
        .gallery-item {
            background: #fff; border: 1px solid #ccc; padding: 10px; margin-bottom: 12px;
        }
        .gallery-item img {
            max-width: 100%; height: auto; display: block; margin-top: 6px; border: 1px solid #eee;
        }
        a { color: #0000EE; text-decoration: underline; }
        .loading-status { text-align: center; font-size: 11px; color: #777; margin: 10px 0; }
    </style>
</head>
<body>
    <p><a href="../">&laquo; Zpět na hlavní stránku</a></p>
    <hr class="oddeleni">

    <h1 id="nadpis">🌑 Temná stránka školy</h1>
    <p class="tady">O temné stránce školy už sice víme, ale víme toho vážně dost? Sem můžeme házet všechny důkazy o tom, co se na škole děje. Kdyby náhodou chtěli stopy zamést...</p>
    
    <div class="retro-box">
        <h3 style="font-size: 13px; margin: 0 0 8px 0; font-weight: bold;">Nahrát nový důkaz:</h3>
        <input type="text" id="darkCaptionInput" placeholder="Popisek důkazu..." class="retro-input">
        <input type="file" id="darkFileInput" accept="image/*" class="retro-input">
        <button onclick="uploadDarkEvidence()" class="retro-button font-bold" id="uploadBtn">Nahrát do galerie</button>
    </div>

    <div id="darkGalleryList">
        <!-- Zde se dynamicky načtou fotky -->
        <p class="tady italic">Načítám důkazy...</p>
    </div>

    <div id="loadingStatus" class="loading-status" style="display: none;">Načítám další starší důkazy...</div>

    <script>
        const firebaseConfig = { databaseURL: "https://gjw-chat-default-rtdb.europe-west1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function uploadDarkEvidence() {
            const captionInput = document.getElementById('darkCaptionInput');
            const fileInput = document.getElementById('darkFileInput');
            const uploadBtn = document.getElementById('uploadBtn');
            const caption = captionInput.value.trim() || "Bez popisku";
            
            if (fileInput.files.length === 0) {
                alert("Vyberte prosím obrázek!");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();
            
            uploadBtn.innerText = "Nahrávám...";
            uploadBtn.disabled = true;

            reader.onload = function(e) {
                const base64Image = e.target.result;
                
                db.ref('darkEvidence').push({
                    caption: caption,
                    image: base64Image,
                    time: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                }, (error) => {
                    uploadBtn.innerText = "Nahrát do galerie";
                    uploadBtn.disabled = false;
                    if (error) {
                        alert("Chyba při nahrávání.");
                    } else {
                        captionInput.value = '';
                        fileInput.value = '';
                        alert("Důkaz úspěšně nahrán do galerie temné stránky školy");
                    }
                });
            };
            reader.readAsDataURL(file);
        }

        const galleryList = document.getElementById('darkGalleryList');
        const loadingStatus = document.getElementById('loadingStatus');

        // Stáhneme pouze seznam klíčů (IDs), což je extrémně rychlé a stáhne se to hned
        db.ref('darkEvidence').orderByKey().once('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                galleryList.innerHTML = '<p class="tady italic">Zatím nebyly nahrány žádné důkazy.</p>';
                loadingStatus.style.display = 'none';
                return;
            }

            // Převedeme klíče na pole a otočíme od nejnovějšího po nejstarší
            const keys = Object.keys(data).reverse();
            galleryList.innerHTML = ''; // Vyčištění nápisu "Načítám..."

            let index = 0;

            function loadItem() {
                if (index >= keys.length) {
                    loadingStatus.style.display = 'none';
                    return;
                }

                if (index > 0) {
                    loadingStatus.style.display = 'block';
                }

                const key = keys[index];
                
                // Stáhneme z databáze detail *pouze* pro tuto jednu konkrétní fotku
                db.ref(`darkEvidence/${key}`).once('value', (itemSnap) => {
                    const item = itemSnap.val();
                    if (item) {
                        const div = document.createElement('div');
                        div.className = "gallery-item";
                        div.innerHTML = `
                            <div style="font-weight: bold; font-size: 13px; color: #1d4372; margin-bottom: 4px;">${item.caption}</div>
                            <img src="${item.image}" alt="Důkaz" loading="lazy">
                            <div style="font-size: 10px; color: #777; margin-top: 6px; text-align: right;">Nahráno: ${item.time}</div>
                        `;
                        galleryList.appendChild(div);
                    }

                    index++;
                    // Hned jak se vykreslí tahle fotka, vyžádáme si další v pořadí
                    requestAnimationFrame(loadItem);
                });
            }

            loadItem();
        });
    </script>
</body>
</html>
