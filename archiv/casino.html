  <script>

	var str1 = "kámen"; var str2 = "papír"; var str3 = "nůžky";
    
	var vybral = "Blank"

	var sc1 = "Výhra"; var sc2 = "Prohra"; var sc3 = "Remíza";
    
	var výsledek = "Blank"
    
	function rps(w, l, t) {let r = Math.floor(Math.random() * 3); 
	if(r==w) {výsledek = sc1}; if(r==l) {výsledek = sc2} ;if(r==t) {výsledek = sc3};
	if(r==0) {vybral = str1}; if(r==1) {vybral = str2}; if(r==2) {vybral = str3};
     alert(výsledek);
     alert("Počítač vybral " + vybral);
     //console.log(vysledek);
     //console.log(vybral);
    } 
  </script>
<body>
	<br>
	<br>
	<br>

	<br>
	<p class="casinotlactk"><button class="tlacitkocasino" onclick="rps(2 ,1 ,0)"> Kámen </button>
	<button class="tlacitkocasino" onclick="rps(0 ,2 ,1)"> Papír </button>
	<button class="tlacitkocasino" onclick="rps(1 ,0 ,2)"> Nůžky </button></p>
