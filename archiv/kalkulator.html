<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/x-icon" href="https://i.imgur.com/UyU5bWX.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalkulátor</title>
</head>
<body>
      <section>
        <div class="container">
            <div id="display"></div>
            <div class="buttons">

            </div>
        </div>
    </section>
    <br>
  <div class="buttons">
    <div class="button">C</div>
    <div class="button">/</div>
    <div class="button">*</div>
    <div class="button">&larr;</div>
    <div class="button">7</div>
    <div class="button">8</div>
    <div class="button">9</div>
    <div class="button">-</div>
    <div class="button">4</div>
    <div class="button">5</div>
    <div class="button">6</div>
    <div class="button">+</div>
    <div class="button">1</div>
    <div class="button">2</div>
    <div class="button">3</div>
    <div class="button">.</div>
    <div class="button">(</div>
    <div class="button">0</div>
    <div class="button">)</div>
    <div id="equal" class="button">=</div>
 </div>
  <p class="buttonystred"><img class="backbutton" src="https://i.imgur.com/Dt6rr3J.png" onclick="window.location.href='tobeuzitecne.html'">
  <img class="homebutton" src="https://i.imgur.com/CyluEHt.png" onclick="window.location.href='index.html'"></p>
</body>
<style>
.backbutton{
   width: 25px;
   cursor: pointer;
}
.homebutton{
  width: 25px;
  cursor: pointer;
}
.buttonystred{
  text-align: center;
}
body{
  background-color: rgb(213, 216, 220);
}
.container {
    max-width: 400px;
    margin: 10vh auto 0 auto;
}
#display {
    text-align: right;
    height: 70px;
    line-height: 70px;
    padding: 16px 8px;
    font-size: 25px;
}
.buttons {
    display: grid;
    border-bottom: 1px solid #999;
    border-left: 1px solid#999;
    grid-template-columns: 1fr 1fr 1fr 1fr;
}
.buttons > div {
    border-top: 1px solid #999;
    border-right: 1px solid#999;
}
.button {
    border: 0.5px solid #999;
    line-height: 100px;
    text-align: center;
    font-size: 25px;
    cursor: pointer;
}
#equal {
    background-color: rgb(85, 85, 255);
    color: white;
}
#equal:hover{
  background-color: #9A0303;
}

.button:hover {
    background-color: #004B09;
    color: white;
    transition: 0.5s ease-in-out;
}
</style>
<script>
  let display = document.getElementById('display');

  let buttons = Array.from(document.getElementsByClassName('button'));

  buttons.map( button => {
    button.addEventListener('click', (e) => {
        switch(e.target.innerText){
            case 'C':
                display.innerText = '';
                break;
            case '=':
                try{
                    display.innerText = eval(display.innerText);
                } catch {
                    display.innerText = "Error"
                }
                break;
            case '←':
                if (display.innerText){
                   display.innerText = display.innerText.slice(0, -1);
                }
                break;
            default:
                display.innerText += e.target.innerText;
        }
    });
});
</script>
</html>
