<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Síň slávy - Školní soutěž GJW</title>
    <meta content="#D5D8DC" data-react-helmet="true" name="theme-color"/>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body {
            background-color: #f0f0f0;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            margin: 15px;
            padding: 10px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            box-sizing: border-box;
        }
        .stred { text-align: center; }
        .oddeleni { border: 0; height: 1px; background: #ccc; margin: 20px 0; }
        h1 { font-size: 20px; font-weight: bold; margin: 15px 0; color: #000000; }
        p { font-size: 14px; line-height: 1.5; color: #333; }
        .back-link { color: #0000EE; text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 15px; }
        .back-link:hover { text-decoration: underline; }
        
        .box {
            background: #fdf6e2;
            border: 2px dashed #d4b126;
            padding: 20px;
            border-radius: 6px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <a class="back-link" href="../">&laquo; Zpět do soutěže</a>
    <hr class="oddeleni">

    <div class="stred">
        <h1>🏛️ Síň slávy – Školní soutěž GJW</h1>
        <p>Síň slávy všech šampiónů a vítězných fotek z minulých týdenních kol.</p>
    </div>

    <div class="box">
        <div id="sineSlavyContainer">Načítám archivy síně slávy...</div>
    </div>

    <hr class="oddeleni">
    <p style="font-size: 11px; color: #666; text-align: center;">Copyright © 2026 Gymnázium Jiřího Wolkera. Všechna práva ukradena.</p>

    <script>
        const firebaseConfig = { databaseURL: "https://gjw-chat-default-rtdb.europe-west1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        window.onload = function() {
            db.ref('soutezApp/historieKol').on('value', snapshot => {
                const historia = snapshot.val();
                const container = document.getElementById('sineSlavyContainer');
                if (!historia) {
                    container.innerHTML = '<p>Síň slávy je zatím prázdná. Po skončení prvního kola se tu objeví archivy vítězů!</p>';
                    return;
                }
                container.innerHTML = '';
                Object.entries(historia).reverse().forEach(([koloId, koloData]) => {
                    let htmlKolo = `<div style="background:#fff; border:1px solid #d4b126; padding:15px; margin:15px 0; border-radius:4px;">
                        <h3 style="margin-top:0; color:#b45309;">📅 Kolo / Týden: ${koloId}</h3><div style="margin-top:8px;">`;
                    if (koloData.top5) {
                        koloData.top5.forEach((v, idx) => {
                            let fotoViteze = v.url ? `<img src="${v.url}" style="width:60px; height:60px; object-fit:cover; border-radius:3px; border:1px solid #94a3b8; margin-right:12px; cursor:pointer;" onclick="window.open('${v.url}', '_blank')" title="Klikni pro zvětšení" />` : '';
                            htmlKolo += `<div style="display:flex; align-items:center; margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:8px;">
                                ${fotoViteze}
                                <div><strong>#${idx+1} ${v.autorNick}</strong> — "${v.popisek}"<br><small>❤️ ${v.likes} srdíček</small></div>
                            </div>`;
                        });
                    }
                    htmlKolo += `</div></div>`;
                    container.innerHTML += htmlKolo;
                });
            });
        };
    </script>
</body>
</html>
