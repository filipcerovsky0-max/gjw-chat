<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymní zpovědnice - GJW</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body {
            background-color: #f0f0f0;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            margin: 15px;
            padding: 10px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            box-sizing: border-box;
        }
        .stred { text-align: center; }
        .oddeleni { border: 0; height: 1px; background: #ccc; margin: 20px 0; }
        #nadpis { font-size: 18px; font-weight: bold; margin: 15px 0 8px 0; color: #000000; }
        .tady { font-size: 12px; color: #333; margin: 4px 0 12px 0; line-height: 1.5; }
        .retro-box { background: #ffffff; border: 1px solid #b0b0a8; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
        .retro-button {
            background: #e2e8f0; border: 1px solid #94a3b8; padding: 6px 14px;
            font-family: Arial, sans-serif; font-size: 12px; cursor: pointer; color: #000; border-radius: 3px; font-weight: bold;
        }
        .retro-button:hover { background: #cbd5e1; }
        .retro-textarea, .retro-input {
            background: #ffffff; border: 1px solid #94a3b8; padding: 8px;
            font-family: Arial, sans-serif; font-size: 13px; color: #000; border-radius: 3px; width: 100%; box-sizing: border-box; margin-bottom: 10px;
            resize: vertical;
        }
        .retro-textarea { height: 90px; }
        .confession-card {
            background: #fff; border: 1px solid #ccc; padding: 12px; margin-bottom: 12px; border-radius: 4px;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.05);
        }
        .confession-text {
            font-size: 14px; color: #111; line-height: 1.5; word-break: break-word; white-space: pre-wrap;
        }
        .confession-footer {
            font-size: 11px; color: #666; margin-top: 8px; display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid #eee; padding-top: 6px;
        }
        .comment-toggle-btn {
            background: none; border: none; color: #0000EE; cursor: pointer; font-size: 11px; padding: 0; text-decoration: underline; font-family: Arial, sans-serif;
        }
        .comments-section {
            margin-top: 10px; background: #fafafa; border: 1px solid #ddd; padding: 10px; border-radius: 3px; display: none;
        }
        .comment-item { font-size: 11px; border-bottom: 1px solid #eee; padding: 5px 0; color: #333; word-break: break-word; }
        .comment-item:last-child { border-bottom: none; }
        .comment-input-row { display: flex; gap: 6px; margin-top: 8px; }
        a { color: #0000EE; text-decoration: underline; }
    </style>
</head>
<body>
    <p><a href="../">&laquo; Zpět na hlavní stránku</a></p>
    <hr class="oddeleni">

    <h1 id="nadpis">anonymní přiznání GJW</h1>
    <p class="tady">Chceš se k něčemu přiznat, ale zůstat u toho anonymní? Zde je to správné místo!</p>
    
    <div class="retro-box">
        <h3 style="font-size: 13px; margin: 0 0 8px 0; font-weight: bold;">Napsat novou zpověď:</h3>
        <textarea id="confessionInput" class="retro-textarea" placeholder="Napiš svou zpověď sem... (zůstaneš anonymní)"></textarea>
        <button onclick="submitConfession()" class="retro-button" id="submitBtn">Odeslat zpověď</button>
    </div>

    <h2 style="font-size: 15px; font-weight: bold; margin: 20px 0 10px 0;">Nejnovější zpovědi GJW:</h2>
    <div id="confessionsList">
        <p class="tady italic">Načítám zpovědi...</p>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://gjw-chat-default-rtdb.europe-west1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function submitConfession() {
            const input = document.getElementById('confessionInput');
            const btn = document.getElementById('submitBtn');
            const text = input.value.trim();

            if (!text) {
                alert("Napiš nejdřív nějakou zpověď!");
                return;
            }

            if (text.length > 500) {
                alert("Zpověď je moc dlouhá (max 500 znaků).");
                return;
            }

            btn.innerText = "Odesílám...";
            btn.disabled = true;

            const timeStr = new Date().toLocaleDateString('cs-CZ') + ' v ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            db.ref('confessions').push({
                text: text,
                time: timeStr,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }, (error) => {
                btn.innerText = "Odeslat zpověď";
                btn.disabled = false;
                if (error) {
                    alert("Chyba při odesílání zpovědi: " + error.message);
                } else {
                    input.value = '';
                    alert("Zpověď byla úspěšně zveřejněna!");
                }
            });
        }

        const confessionsList = document.getElementById('confessionsList');

        // Načítání zpovědí seřazených přes Firebase query (od nejnovějších)
        db.ref('confessions').orderByChild('timestamp').on('value', (snapshot) => {
            const data = snapshot.val();
            confessionsList.innerHTML = '';

            if (!data) {
                confessionsList.innerHTML = '<p class="tady italic">Zatím tu není žádná zpověď. Buď první!</p>';
                return;
            }

            const confessionsArray = [];
            for (let key in data) {
                confessionsArray.push({ id: key, ...data[key] });
            }
            confessionsArray.reverse();

            confessionsArray.forEach((item) => {
                const div = document.createElement('div');
                div.className = "confession-card";
                div.innerHTML = `
                    <div class="confession-text">${escapeHtml(item.text || '')}</div>
                    <div class="confession-footer">
                        <span>#gjwzpovedi • ${item.time || 'Neznámý čas'}</span>
                        <button class="comment-toggle-btn" onclick="toggleComments('${item.id}')" id="btn-toggle-${item.id}">💬 Komentáře</button>
                    </div>
                    <div id="comments-section-${item.id}" class="comments-section">
                        <div id="comments-list-${item.id}">Načítám komentáře...</div>
                        <div class="comment-input-row">
                            <input type="text" id="comment-input-${item.id}" placeholder="Napiš anonymní komentář..." class="retro-input" style="margin:0; font-size:11px;">
                            <button onclick="addComment('${item.id}')" class="retro-button" style="font-size:10px; padding:4px 8px;">Odeslat</button>
                        </div>
                    </div>
                `;
                confessionsList.appendChild(div);
                loadCommentsCountAndList(item.id);
            });
        });

        function toggleComments(postId) {
            const section = document.getElementById(`comments-section-${postId}`);
            section.style.display = section.style.display === 'block' ? 'none' : 'block';
        }

        function addComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();

            if (!text) {
                alert("Napiš text komentáře!");
                return;
            }

            if (text.length > 250) {
                alert("Komentář je moc dlouhý (max 250 znaků).");
                return;
            }

            const timeStr = new Date().toLocaleDateString('cs-CZ') + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            db.ref(`confessionComments/${postId}`).push({
                text: text,
                time: timeStr,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }, (error) => {
                if (!error) {
                    input.value = '';
                } else {
                    alert("Chyba při odesílání komentáře.");
                }
            });
        }

        function loadCommentsCountAndList(postId) {
            db.ref(`confessionComments/${postId}`).on('value', (snapshot) => {
                const comData = snapshot.val();
                const listEl = document.getElementById(`comments-list-${postId}`);
                const toggleBtn = document.getElementById(`btn-toggle-${postId}`);
                if (!listEl || !toggleBtn) return;

                if (!comData) {
                    listEl.innerHTML = '<div class="comment-item italic" style="color:#777;">Zatím žádné komentáře. Buď první!</div>';
                    toggleBtn.innerText = `💬 Komentáře (0)`;
                    return;
                }

                const commentsArray = Object.values(comData);
                toggleBtn.innerText = `💬 Komentáře (${commentsArray.length})`;

                listEl.innerHTML = '';
                commentsArray.forEach((com) => {
                    const cDiv = document.createElement('div');
                    cDiv.className = 'comment-item';
                    cDiv.innerHTML = `<strong>Anonym:</strong> ${escapeHtml(com.text)} <span style="font-size:9px; color:#886; float:right;">${com.time}</span>`;
                    listEl.appendChild(cDiv);
                });
            });
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
