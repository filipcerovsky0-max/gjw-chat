<!DOCTYPE html>
<html lang="cs" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GJW Chat - Diskuzní Portál</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body {
            background-color: #f0f0f0;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
        }
        .retro-box { background: #ffffff; border: 1px solid #b0b0a8; padding: 12px; }
        .retro-button {
            background: #e2e8f0; border: 1px solid #94a3b8; padding: 5px 12px;
            font-family: Arial, sans-serif; font-size: 12px; cursor: pointer; color: #000; border-radius: 3px;
        }
        .retro-button:hover { background: #cbd5e1; }
        .retro-input, .retro-select, .retro-textarea {
            background: #ffffff; border: 1px solid #94a3b8; padding: 6px;
            font-family: Arial, sans-serif; font-size: 12px; color: #000; border-radius: 3px;
        }
        .rainbow-admin {
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold;
        }
        a { color: #0000EE; text-decoration: underline; }
    </style>
</head>
<body class="h-full flex flex-col m-0 p-0 overflow-hidden">

    <!-- Ban obrazovka s reálným odpočtem -->
    <div id="bannedScreen" class="fixed inset-0 bg-black/9א z-[99999] hidden flex-col items-center justify-center p-4 text-center text-white">
        <div class="retro-box bg-white text-black p-6 max-w-sm w-full space-y-3">
            <h1 class="text-sm font-bold text-red-600">MÁŠ AKTIVNÍ BAN</h1>
            <div class="text-left space-y-1 text-xs">
                <p>Důvod: <span id="bannedReasonText" class="font-bold">-</span></p>
                <p>Trvání: <span id="bannedDurationText" class="font-bold">-</span></p>
                <p id="bannedCountdownContainer" class="pt-1 text-red-700 hidden font-bold">Vyprší za: <span id="bannedCountdownTimer">-</span></p>
            </div>
            <p class="text-[10px] text-gray-500">Trest je vázán na tvé zařízení.</p>
        </div>
    </div>

    <!-- Uživatelský profil modal pro admina -->
    <div id="userProfileModal" class="fixed inset-0 bg-black/40 z-50 hidden items-center justify-center p-4">
        <div class="retro-box bg-[#f0f0f0] p-4 w-full max-w-sm space-y-3 border-2 border-[#1d4372]">
            <div class="flex justify-between items-center bg-[#1d4372] text-white px-2 py-1 -mx-2 -mt-2 mb-2 font-bold">
                <span id="profileUsernameTitle">Uživatel</span>
                <button onclick="closeUserProfileModal()" class="cursor-pointer px-1">X</button>
            </div>
            <p class="text-[11px]" id="profileUserIdSub">ID: -</p>
            
            <div class="space-y-2 pt-1 border-t border-gray-300">
                <div class="flex gap-1">
                    <button onclick="actionKickActive()" class="retro-button text-red-700 font-bold flex-1">Kick</button>
                    <button onclick="actionMuteActive()" class="retro-button text-orange-700 font-bold flex-1">Mute</button>
                </div>
                <button onclick="actionBanActive()" class="retro-button text-red-900 font-bold w-full bg-red-100">Udělit Ban</button>
            </div>
            <div class="flex justify-end pt-2">
                <button onclick="closeUserProfileModal()" class="retro-button">Zavřít</button>
            </div>
        </div>
    </div>

    <!-- Přihlášení -->
    <div id="loginScreen" class="fixed inset-0 bg-[#f0f0f0] z-[9999] flex flex-col items-center justify-center p-4">
        <div class="retro-box p-6 w-full max-w-sm space-y-3 shadow-md bg-white">
            <div class="text-center">
                <img src="https://i.imgur.com/QvqvK3M.png" alt="Logo" class="max-h-20 mx-auto mb-2">
                <h2 class="font-bold text-base text-black">GJW Diskuzní Portál</h2>
                <p class="text-[11px] text-gray-600">Pro vstup do chatu zadej své údaje</p>
            </div>
            <div class="space-y-2 pt-2">
                <label class="block text-[11px] font-bold text-black">Přezdívka:</label>
                <input type="text" id="loginNickname" placeholder="zadej nickname..." class="retro-input w-full" maxlength="20" autocomplete="off">
                
                <label class="block text-[11px] font-bold text-black">Třída:</label>
                <select id="loginClass" class="retro-select w-full">
                    <option value="">(bez třídy / učitel)</option>
                    <option value="O1.A">O1.A</option><option value="O1.B">O1.B</option>
                    <option value="O2.A">O2.A</option><option value="O2.B">O2.B</option>
                    <option value="O3.A">O3.A</option><option value="O3.B">O3.B</option>
                    <option value="O4.A">O4.A</option><option value="O4.B">O4.B</option>
                    <option value="O5.A">O5.A</option><option value="O5.B">O5.B</option>
                    <option value="O6.A">O6.A</option><option value="O6.B">O6.B</option>
                    <option value="O7.A">O7.A</option><option value="O7.B">O7.B</option>
                    <option value="O8.A">O8.A</option><option value="O8.B">O8.B</option>
                </select>
                <button onclick="handleLogin()" class="retro-button w-full font-bold py-2 mt-2">Vstoupit do chatu</button>
                <div id="loginError" class="text-red-600 text-[11px] text-center hidden font-bold"></div>
            </div>
            <div class="text-center pt-2 border-t border-gray-300">
                <a href="../" class="text-xs">&laquo; Zpět na hlavní stránku</a>
            </div>
        </div>
    </div>

    <!-- Hlavička chatu -->
    <header class="border-b border-gray-300 bg-[#e2e8f0] px-3 py-2 flex justify-between items-center shrink-0">
        <div class="flex items-center space-x-2">
            <a href="../" class="text-blue-700 font-bold">&larr; Hlavní web</a>
            <span class="font-bold">| GJW Chat</span>
            <span id="userSubtitle" class="text-gray-600 text-xs">-</span>
        </div>
        <div class="flex items-center space-x-2">
            <span class="text-xs">Online: <span id="onlineCountBadge" class="font-bold text-green-700">1</span></span>
            <button onclick="handleLogout()" class="retro-button">Odhlásit</button>
        </div>
    </header>

    <!-- Tělo chatu -->
    <div class="flex-1 flex flex-col overflow-hidden relative bg-white w-full max-w-3xl mx-auto border-x border-gray-300">
        <div id="mutedNoticeBox" class="hidden bg-red-100 border-b border-red-300 p-2 text-center text-red-700 text-xs font-bold">
            Jsi ztlumen správcem! <span id="mutedCountdownContainer" class="font-normal">Zbývá: <span id="mutedCountdownTimer">-</span></span>
        </div>

        <div id="chatContainer" class="flex-1 overflow-y-auto p-3 space-y-2 pb-20">
            <div id="emptyState" class="hidden h-full flex items-center justify-center text-gray-400 italic">Zatím žádné zprávy v této místnosti</div>
            <div id="messagesList" class="space-y-2 w-full"></div>
        </div>

        <footer id="activeInputControls" class="border-t border-gray-300 bg-[#f0f0f0] p-2 absolute bottom-0 left-0 right-0">
            <div class="flex items-center space-x-2 max-w-3xl mx-auto px-2">
                <textarea id="messageInput" placeholder="Napiš zprávu... (Enter pro odeslání)" rows="1" class="retro-textarea flex-1 resize-none" onkeydown="handleKeydown(event)"></textarea>
                <button onclick="sendMessage()" class="retro-button font-bold px-4 py-1.5">Odeslat</button>
            </div>
        </footer>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://gjw-chat-default-rtdb.europe-west1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function getDeviceFingerprint() {
            let fp = localStorage.getItem('gjw_device_fingerprint');
            if (!fp) {
                fp = 'device_' + Math.random().toString(36).substring(2, 10) + '_' + Date.now();
                localStorage.setItem('gjw_device_fingerprint', fp);
            }
            return fp;
        }

        let deviceFingerprint = getDeviceFingerprint();
        let currentUser = localStorage.getItem('gjw_saved_user') || null;
        let currentUserId = localStorage.getItem('gjw_saved_user_id') || null;
        if (!currentUserId) {
            currentUserId = 'user_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('gjw_saved_user_id', currentUserId);
        }

        let isAdmin = sessionStorage.getItem('gjw_admin_session') === 'true';
        let adminMode = sessionStorage.getItem('gjw_admin_mode') || 'observed'; // 'observed' nebo 'hidden'
        let activeProfileUid = null;
        let activeProfileName = null;
        let restrictionInterval = null;

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('gjw_admin_session') === 'true') {
                isAdmin = true;
                currentUser = "admin (Admin)";
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('userSubtitle').innerText = currentUser;
                renderMessages();
            } else if (currentUser) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('userSubtitle').innerText = currentUser;
                renderMessages();
            } else {
                document.getElementById('loginScreen').style.display = 'flex';
            }
        });

        // Sledování restrikcí a banů vázaných na zařízení
        db.ref('restrictions').on('value', snap => {
            const restrictions = snap.val() || {};
            let myRest = restrictions[currentUserId];
            
            // Pokud není pod ID, zkontrolujeme fingerprint
            if (!myRest) {
                for (let uid in restrictions) {
                    if (restrictions[uid].fingerprint === deviceFingerprint) {
                        myRest = restrictions[uid];
                        break;
                    }
                }
            }

            if (!myRest) {
                document.getElementById('bannedScreen').style.display = 'none';
                document.getElementById('mutedNoticeBox').classList.add('hidden');
                document.getElementById('activeInputControls').style.display = 'block';
                return;
            }

            if (myRest.kicked) {
                alert("Byl jsi vyhozen správcem!");
                db.ref('restrictions/' + (myRest.userId || currentUserId) + '/kicked').remove();
                handleLogout();
                return;
            }

            if (myRest.ban && (myRest.ban.permanent || Date.now() < myRest.ban.expiresAt)) {
                const ban = myRest.ban;
                document.getElementById('bannedReasonText').innerText = ban.reason || 'Bez důvodu';
                document.getElementById('bannedDurationText').innerText = ban.permanent ? 'Natrvalo' : `Do ${new Date(ban.expiresAt).toLocaleString()}`;
                
                const countContainer = document.getElementById('bannedCountdownContainer');
                const countTimer = document.getElementById('bannedCountdownTimer');

                if (!ban.permanent && ban.expiresAt) {
                    countContainer.classList.remove('hidden');
                    if (restrictionInterval) clearInterval(restrictionInterval);
                    restrictionInterval = setInterval(() => {
                        const rem = ban.expiresAt - Date.now();
                        if (rem <= 0) { clearInterval(restrictionInterval); location.reload(); return; }
                        const d = Math.floor(rem / 86400000);
                        const h = Math.floor((rem % 86400000) / 3600000);
                        const m = Math.floor((rem % 3600000) / 60000);
                        const s = Math.floor((rem % 60000) / 1000);
                        countTimer.innerText = `${d}d ${h}h ${m}m ${s}s`;
                    }, 1000);
                }
                document.getElementById('bannedScreen').style.display = 'flex';
                return;
            }

            if (myRest.mute && (myRest.mute.permanent || Date.now() < myRest.mute.expiresAt)) {
                const mute = myRest.mute;
                const notice = document.getElementById('mutedNoticeBox');
                const timer = document.getElementById('mutedCountdownTimer');
                notice.classList.remove('hidden');
                document.getElementById('activeInputControls').style.display = 'none';

                if (!mute.permanent && mute.expiresAt) {
                    if (restrictionInterval) clearInterval(restrictionInterval);
                    restrictionInterval = setInterval(() => {
                        const rem = mute.expiresAt - Date.now();
                        if (rem <= 0) { clearInterval(restrictionInterval); location.reload(); return; }
                        const m = Math.floor(rem / 60000);
                        const s = Math.floor((rem % 60000) / 1000);
                        timer.innerText = `${m}m ${s}s`;
                    }, 1000);
                }
            } else {
                document.getElementById('mutedNoticeBox').classList.add('hidden');
                document.getElementById('activeInputControls').style.display = 'block';
            }
        });

        function handleLogin() {
            const nick = document.getElementById('loginNickname').value.trim();
            const cls = document.getElementById('loginClass').value;
            const err = document.getElementById('loginError');
            if (!nick) { err.innerText = "Zadej přezdívku!"; err.classList.remove('hidden'); return; }
            
            currentUser = nick + (cls ? ' (' + cls + ')' : '');
            localStorage.setItem('gjw_saved_user', currentUser);
            
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('userSubtitle').innerText = currentUser;

            db.ref('messages').push({
                userId: currentUserId,
                fingerprint: deviceFingerprint,
                user: currentUser,
                text: `${currentUser} vstoupil do chatu`,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                isSystem: true
            });
            renderMessages();
        }

        function handleLogout() {
            localStorage.removeItem('gjw_saved_user');
            sessionStorage.removeItem('gjw_admin_session');
            location.reload();
        }

        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            const isGhost = isAdmin && adminMode === 'hidden';

            db.ref('messages').push({
                userId: currentUserId,
                fingerprint: deviceFingerprint,
                user: currentUser,
                isAdmin: isAdmin && !isGhost,
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
        }

        function openUserProfileModal(uid, username) {
            if (!isAdmin) return;
            activeProfileUid = uid;
            activeProfileName = username;
            document.getElementById('profileUsernameTitle').innerText = username;
            document.getElementById('profileUserIdSub').innerText = 'ID: ' + uid;
            document.getElementById('userProfileModal').classList.remove('hidden');
            document.getElementById('userProfileModal').classList.add('flex');
        }

        function closeUserProfileModal() {
            document.getElementById('userProfileModal').classList.remove('flex');
            document.getElementById('userProfileModal').classList.add('hidden');
        }

        function actionKickActive() {
            if (!activeProfileUid) return;
            db.ref('restrictions/' + activeProfileUid).update({ kicked: true, fingerprint: deviceFingerprint, userId: activeProfileUid });
            alert("Uživatel byl vyhozen.");
            closeUserProfileModal();
        }

        function actionMuteActive() {
            if (!activeProfileUid) return;
            const val = prompt("Zadejte délku ztlumení (např. 30s, 10m, 2h, 1d nebo 'perm' pro natrvalo):");
            if (!val) return;
            const ms = parseDuration(val);
            const permanent = val.toLowerCase() === 'perm';
            
            db.ref('restrictions/' + activeProfileUid).update({
                mute: { permanent: permanent, expiresAt: permanent ? 0 : Date.now() + ms },
                userId: activeProfileUid
            });
            alert("Uživatel byl ztlumen.");
            closeUserProfileModal();
        }

        function actionBanActive() {
            if (!activeProfileUid) return;
            const val = prompt("Zadejte délku banu (např. 1h, 7d, 30d nebo 'perm' pro natrvalo):");
            if (!val) return;
            const reason = prompt("Zadejte důvod banu:") / "Porušení pravidel";
            const ms = parseDuration(val);
            const permanent = val.toLowerCase() === 'perm';

            db.ref('restrictions/' + activeProfileUid).update({
                ban: { permanent: permanent, expiresAt: permanent ? 0 : Date.now() + ms, reason: reason || 'Porušení pravidel', username: activeProfileName },
                userId: activeProfileUid
            });
            alert("Uživatel byl zabanován.");
            closeUserProfileModal();
        }

        function parseDuration(str) {
            str = str.toLowerCase().trim();
            if (str === 'perm') return 0;
            const num = parseInt(str);
            if (isNaN(num)) return 60000;
            if (str.includes('s')) return num * 1000;
            if (str.includes('m')) return num * 60000;
            if (str.includes('h')) return num * 3600000;
            if (str.includes('d')) return num * 86400000;
            if (str.includes('w')) return num * 604800000;
            if (str.includes('mo')) return num * 2592000000;
            return num * 60000;
        }

        db.ref('messages').on('value', (snapshot) => {
            const data = snapshot.val();
            const messagesList = document.getElementById('messagesList');
            messagesList.innerHTML = '';
            if (!data) { document.getElementById('emptyState').classList.remove('hidden'); return; }
            document.getElementById('emptyState').classList.add('hidden');

            Object.values(data).forEach(msg => {
                const div = document.createElement('div');
                if (msg.isSystem) {
                    div.className = "text-center text-gray-500 text-[11px] italic my-1";
                    div.innerText = `-- ${msg.text} --`;
                } else {
                    div.className = "bg-white border border-gray-300 p-2 rounded shadow-sm text-xs";
                    const nameHtml = msg.isAdmin 
                        ? `<span class="rainbow-admin cursor-pointer" onclick="openUserProfileModal('${msg.userId}', '${msg.user}')">${msg.user}</span>`
                        : `<span class="font-bold text-blue-900 cursor-pointer underline" onclick="openUserProfileModal('${msg.userId}', '${msg.user}')">${msg.user}</span>`;
                    
                    div.innerHTML = `<div class="flex justify-between text-[11px] mb-0.5"><span>${nameHtml}</span><span class="text-gray-400 font-normal">${msg.time}</span></div><div>${msg.text}</div>`;
                }
                messagesList.appendChild(div);
            });
            window.scrollTo(0, document.body.scrollHeight);
        });
    </script>
</body>
</html>
