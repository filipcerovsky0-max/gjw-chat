<!DOCTYPE html>
<html lang="cs" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GJW Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        .rainbow-admin {
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-black text-gray-200 h-full flex flex-col font-mono text-xs">

    <!-- Ban obrazovka -->
    <div id="bannedScreen" class="fixed inset-0 bg-black z-[9999] hidden flex flex-col items-center justify-center p-4 text-center space-y-3">
        <div class="border border-red-600 p-4 max-w-xs w-full space-y-2 bg-zinc-950">
            <h1 class="text-sm font-bold text-red-500">BAN</h1>
            <div class="text-left space-y-1 text-gray-400">
                <p>Důvod: <span id="bannedReasonText" class="text-white">-</span></p>
                <p>Trvání: <span id="bannedDurationText" class="text-white">-</span></p>
                <p id="bannedCountdownContainer" class="pt-1 text-yellow-400 hidden">Zpět za: <span id="bannedCountdownTimer">-</span></p>
            </div>
        </div>
    </div>

    <!-- Úprava zprávy -->
    <div id="editModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="border border-zinc-800 bg-zinc-950 p-3 w-full max-w-sm space-y-2">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-1">
                <span class="font-bold">Upravit zprávu</span>
                <button onclick="closeEditModal()" class="cursor-pointer">X</button>
            </div>
            <textarea id="editModalInput" rows="3" class="w-full bg-black border border-zinc-800 p-2 text-white focus:outline-none"></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="closeEditModal()" class="border border-zinc-700 px-2 py-1 cursor-pointer">Zrušit</button>
                <button onclick="saveEditedMessage()" class="border border-zinc-500 bg-zinc-900 px-2 py-1 cursor-pointer">Uložit</button>
            </div>
        </div>
    </div>

    <!-- Uživatelský profil (pro admina) -->
    <div id="userProfileModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="border border-zinc-800 bg-zinc-950 p-3 w-full max-w-sm max-h-[80vh] flex flex-col space-y-2">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-1">
                <div>
                    <span id="profileUsernameTitle" class="font-bold">Uživatel</span>
                    <p id="profileUserIdSub" class="text-[9px] text-zinc-500">-</p>
                </div>
                <button onclick="closeUserProfileModal()" class="cursor-pointer">X</button>
            </div>
            <div class="flex gap-1 flex-wrap">
                <button id="profileKickBtn" class="border border-yellow-700 text-yellow-400 px-2 py-0.5 cursor-pointer">Kick</button>
                <button id="profileMuteBtn" class="border border-orange-700 text-orange-400 px-2 py-0.5 cursor-pointer">Mute</button>
                <button id="profileBanBtn" class="border border-red-700 text-red-400 px-2 py-0.5 cursor-pointer">Ban</button>
                <button id="profileRenameBtn" class="border border-blue-700 text-blue-400 px-2 py-0.5 cursor-pointer">Jméno</button>
            </div>
            <div id="profileUserMessagesList" class="flex-1 overflow-y-auto border border-zinc-900 p-2 space-y-2 bg-black"></div>
            <div class="flex justify-end">
                <button onclick="closeUserProfileModal()" class="border border-zinc-700 px-2 py-1 cursor-pointer">Zavřít</button>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="imageLightbox" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col items-center justify-center p-4">
        <button onclick="closeLightbox()" class="absolute top-3 right-3 border border-zinc-700 px-2 py-1 cursor-pointer">Zavřít</button>
        <img id="lightboxImg" class="max-w-full max-h-[85vh] object-contain border border-zinc-800">
    </div>

    <!-- Přihlášení -->
    <div id="loginScreen" class="fixed inset-0 bg-black z-50 flex flex-col justify-between p-4 overflow-y-auto">
        <div class="flex-1 flex items-center justify-center w-full">
            <div class="border border-zinc-800 bg-zinc-950 p-5 w-full max-w-xs space-y-3">
                <div class="text-center">
                    <div id="logoTrigger" onclick="handleLogoClick()" class="font-bold tracking-widest cursor-pointer py-1 text-sm">GJW CHAT</div>
                    <p class="text-[10px] text-zinc-500">studentský projekt</p>
                </div>
                <div class="space-y-2">
                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-0.5">Přezdívka</label>
                        <input type="text" id="loginNickname" placeholder="jméno..." class="w-full bg-black border border-zinc-800 p-2 text-white focus:outline-none" maxlength="20" autocomplete="off">
                    </div>
                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-0.5">Třída</label>
                        <select id="loginClass" class="w-full bg-black border border-zinc-800 p-2 text-white focus:outline-none">
                            <option value="">(bez třídy)</option>
                            <option value="01.A">01.A</option><option value="01.B">01.B</option>
                            <option value="02.A">02.A</option><option value="02.B">02.B</option>
                            <option value="03.A">03.A</option><option value="03.B">03.B</option>
                            <option value="04.A">04.A</option><option value="04.B">04.B</option>
                            <option value="05.A">05.A</option><option value="05.B">05.B</option>
                            <option value="06.A">06.A</option><option value="06.B">06.B</option>
                            <option value="07.A">07.A</option><option value="07.B">07.B</option>
                            <option value="08.A">08.A</option><option value="08.B">08.B</option>
                        </select>
                    </div>
                    <button onclick="handleLogin()" class="w-full border border-zinc-700 bg-zinc-900 py-2 hover:bg-zinc-800 cursor-pointer">Vstoupit do chatu</button>
                    <div id="loginError" class="text-red-500 text-[10px] text-center hidden"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="adminPageScreen" class="fixed inset-0 bg-black z-50 hidden flex items-center justify-center p-4">
        <div class="border border-zinc-800 bg-zinc-950 p-4 w-full max-w-3xl max-h-[90vh] flex flex-col space-y-3">
            <div id="adminAuthBox" class="space-y-3 my-auto max-w-xs mx-auto text-center">
                <h1 class="font-bold">Admin Login</h1>
                <input type="password" id="adminPasswordInput" placeholder="heslo..." class="w-full bg-black border border-zinc-800 p-2 text-white focus:outline-none">
                <button onclick="verifyAdminPassword()" class="w-full border border-zinc-700 bg-zinc-900 py-1.5 cursor-pointer">Ověřit</button>
                <div id="adminLoginError" class="text-red-500 text-[10px] hidden">Špatné heslo</div>
                <a href="./" class="block text-[10px] text-zinc-500 underline pt-1">Zpět</a>
            </div>

            <div id="adminDashboardBox" class="hidden flex-1 overflow-y-auto space-y-3 pr-1">
                <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                    <span class="font-bold">Admin Panel</span>
                    <div class="flex gap-2">
                        <button onclick="clearChatData()" class="border border-red-800 text-red-400 px-2 py-0.5 cursor-pointer">Clear</button>
                        <a href="./" class="border border-zinc-700 px-2 py-0.5">Odhlásit</a>
                    </div>
                </div>

                <div class="border border-zinc-900 p-2.5 bg-black flex flex-col sm:flex-row justify-between items-center gap-2">
                    <select id="adminModeSelect" class="bg-black border border-zinc-800 p-1.5 text-white w-full sm:w-auto">
                        <option value="observed">Viditelný admin</option>
                        <option value="hidden">Ghost admin</option>
                    </select>
                    <button onclick="openChatFromAdmin()" class="border border-zinc-700 bg-zinc-900 px-3 py-1.5 cursor-pointer w-full sm:w-auto">Vstoupit</button>
                </div>

                <div class="border border-zinc-900 p-2.5 bg-black space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-yellow-400 font-bold">Uživatelé</span>
                        <input type="text" id="adminUserSearchInput" placeholder="hledat..." oninput="renderAdminUsersList()" class="bg-black border border-zinc-800 p-1 w-32">
                    </div>
                    <div id="adminUsersListContainer" class="space-y-1 max-h-32 overflow-y-auto"></div>
                </div>

                <div class="border border-zinc-900 p-2.5 bg-black space-y-1">
                    <span class="text-red-400 font-bold">Bany</span>
                    <div id="adminBansLogContainer" class="space-y-1 max-h-24 overflow-y-auto bg-zinc-950 p-1.5"></div>
                </div>

                <div class="border border-zinc-900 p-2.5 bg-black space-y-1">
                    <span class="text-yellow-400 font-bold">Obrázky</span>
                    <div id="adminImageLogContainer" class="space-y-1 max-h-24 overflow-y-auto bg-zinc-950 p-1.5"></div>
                </div>

                <div class="border border-zinc-900 p-2.5 bg-black space-y-1">
                    <span class="text-yellow-400 font-bold">Memy (emotikony)</span>
                    <input type="file" id="adminEmojiUploadInput" accept="image/*" class="hidden" onchange="handleAdminUploadEmoji(event)">
                    <button onclick="document.getElementById('adminEmojiUploadInput').click()" class="border border-zinc-700 bg-zinc-900 px-2 py-1 cursor-pointer">Nahrát obrázek</button>
                    <div id="adminEmojiList" class="flex flex-wrap gap-1 pt-1"></div>
                </div>

                <div class="border border-zinc-900 p-2.5 bg-black space-y-1">
                    <span class="text-zinc-400 font-bold">Logy připojení</span>
                    <div id="adminLogContainer" class="bg-zinc-950 p-1.5 max-h-24 overflow-y-auto text-[10px]"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hlavní hlavička -->
    <header class="border-b border-zinc-900 bg-black px-3 py-2 flex justify-between items-center shrink-0">
        <div class="flex items-center space-x-2">
            <span id="headerLogoTrigger" onclick="handleLogoClick()" class="font-bold cursor-pointer">GJW</span>
            <span id="userSubtitle" class="text-zinc-500">-</span>
        </div>
        <div class="flex items-center space-x-2">
            <div class="border border-zinc-800 px-2 py-0.5 text-[10px] flex items-center gap-1">
                <span class="w-1.5 h-1.5 bg-green-500"></span>
                <span>Online: <span id="onlineCountBadge" class="text-green-400 font-mono">1</span></span>
            </div>
            <button id="adminHeaderBtn" onclick="openAdminModalFromChat()" class="hidden border border-amber-800 text-amber-400 px-2 py-0.5 cursor-pointer">Admin</button>
            <button onclick="handleLogout()" class="border border-zinc-700 px-2 py-0.5 cursor-pointer">Odhlásit</button>
        </div>
    </header>

    <!-- Chat tělo -->
    <div class="flex-1 flex flex-col overflow-hidden relative">
        <div id="chatContainer" class="flex-1 overflow-y-auto p-3 space-y-2 pb-28">
            <div id="emptyState" class="hidden h-full flex items-center justify-center text-zinc-600">Žádné zprávy</div>
            <div id="messagesList" class="space-y-2 max-w-xl mx-auto"></div>
        </div>

        <button id="scrollToBottomBtn" onclick="scrollToBottom(true)" class="fixed bottom-16 right-3 border border-zinc-700 bg-zinc-900 px-2 py-1 text-[10px] opacity-0 pointer-events-none cursor-pointer">Nové zprávy</button>

        <!-- Footer -->
        <footer class="border-t border-zinc-900 bg-black p-2.5 shrink-0 fixed bottom-0 left-0 right-0 z-40">
            <div class="max-w-xl mx-auto flex flex-col space-y-2">
                
                <div id="mutedNoticeBox" class="hidden w-full border border-red-900 bg-red-950/30 p-2 text-center text-red-400 space-y-0.5">
                    <span id="mutedNoticeText">Jsi ztlumen.</span>
                    <div id="mutedCountdownContainer" class="text-yellow-400 hidden">Zbývá: <span id="mutedCountdownTimer">-</span></div>
                </div>

                <div id="activeInputControls" class="space-y-1.5">
                    <div id="imageSourcePopup" class="hidden absolute bottom-12 left-0 border border-zinc-800 bg-zinc-950 p-1 shadow-lg w-28 z-50 flex flex-col space-y-1">
                        <button onclick="triggerFileInput(false)" class="text-left p-1 hover:bg-zinc-900 cursor-pointer">Galerie</button>
                        <button onclick="triggerFileInput(true)" class="text-left p-1 hover:bg-zinc-900 cursor-pointer">Fotoaparát</button>
                    </div>

                    <div id="emojiPickerPopup" class="hidden absolute bottom-12 left-10 border border-zinc-800 bg-zinc-950 p-2 shadow-lg w-48 max-h-36 overflow-y-auto z-50">
                        <div id="emojiPickerContent" class="flex flex-wrap gap-1"></div>
                    </div>

                    <input type="file" id="imageInputGallery" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                    <input type="file" id="imageInputCamera" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event)">

                    <div id="imagePreviewContainer" class="hidden p-1.5 border border-zinc-800 bg-zinc-950 flex items-center justify-between">
                        <img id="imagePreview" class="h-8 w-8 object-cover border border-zinc-800">
                        <button onclick="clearImagePreview()" class="text-zinc-500 cursor-pointer">Zrušit</button>
                    </div>

                    <div class="flex items-end space-x-1.5">
                        <button onclick="toggleImageSourceMenu()" class="border border-zinc-800 bg-zinc-900 p-2 cursor-pointer" title="Foto">📷</button>
                        <button onclick="toggleMemePicker()" class="border border-zinc-800 bg-zinc-900 px-2 py-2 font-bold cursor-pointer">MEME</button>
                        <textarea id="messageInput" placeholder="Napiš zprávu..." rows="1" class="flex-1 bg-black border border-zinc-800 p-2 text-white focus:outline-none resize-none max-h-20" onkeydown="handleKeydown(event)"></textarea>
                        <button onclick="sendMessage()" class="border border-zinc-700 bg-zinc-900 px-3 py-2 cursor-pointer">Odeslat</button>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://gjw-chat-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function getDeviceFingerprint() {
            let fp = localStorage.getItem('gjw_device_fingerprint');
            if (!fp) {
                fp = 'device_' + Math.random().toString(36).substring(2, 10) + '_' + Date.now() + '_' + screen.width + 'x' + screen.height;
                localStorage.setItem('gjw_device_fingerprint', fp);
            }
            return fp;
        }

        let currentUser = localStorage.getItem('gjw_saved_user') || null;
        let currentUserId = localStorage.getItem('gjw_saved_user_id') || null;
        let deviceFingerprint = getDeviceFingerprint();
        let isAdmin = false;
        let selectedImageBase64 = null;
        let isUserAtBottom = true;
        let clientPublicIp = 'Neznámá IP';
        let logoClicks = 0;
        let logoClickTimer = null;
        let cloudMessages = [];
        let cloudEmojis = [];
        let cloudRestrictions = {};
        let editingMessageId = null;
        let activeProfileUserId = null;
        let restrictionCountdownInterval = null;

        const chatContainer = document.getElementById('chatContainer');
        const messagesList = document.getElementById('messagesList');
        const emptyState = document.getElementById('emptyState');
        const scrollToBottomBtn = document.getElementById('scrollToBottomBtn');

        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => { clientPublicIp = data.ip; })
            .catch(() => {});

        const connectedRef = db.ref('.info/connected');
        const presenceRef = db.ref('presence');

        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                const myPresenceRef = presenceRef.push();
                myPresenceRef.onDisconnect().remove();
                myPresenceRef.set({ fingerprint: deviceFingerprint, user: currentUser || 'Anonym' });
            }
        });

        presenceRef.on('value', (snapshot) => {
            const data = snapshot.val();
            const count = data ? Object.keys(data).length : 1;
            const badge = document.getElementById('onlineCountBadge');
            if (badge) badge.innerText = count;
        });

        db.ref('messages').on('value', (snapshot) => {
            const data = snapshot.val();
            cloudMessages = data ? Object.values(data) : [];
            renderMessages();
            if (!document.getElementById('userProfileModal').classList.contains('hidden') && activeProfileUserId) {
                renderUserProfileModalContent(activeProfileUserId);
            }
        });

        db.ref('emojis').on('value', (snapshot) => {
            const data = snapshot.val();
            cloudEmojis = data ? Object.values(data) : [];
        });

        db.ref('restrictions').on('value', (snapshot) => {
            cloudRestrictions = snapshot.val() || {};
            checkLiveRestrictions();
            if (!document.getElementById('adminDashboardBox').classList.contains('hidden')) {
                renderAdminUsersList();
                renderAdminBansLog();
                renderAdminImageLog();
                renderAdminLogs();
            }
        });

        function getStorageAuditLog() {
            try { return JSON.parse(localStorage.getItem('gjw_chat_audit') || '[]'); } catch(e) { return []; }
        }
        function saveStorageAuditLog(logs) {
            localStorage.setItem('gjw_chat_audit', JSON.stringify(logs));
        }

        function checkLiveRestrictions() {
            if (isAdmin) return;

            let matchedRest = null;
            if (currentUserId && cloudRestrictions[currentUserId]) {
                matchedRest = cloudRestrictions[currentUserId];
            } else {
                for (let uid in cloudRestrictions) {
                    if (cloudRestrictions[uid].fingerprint === deviceFingerprint) {
                        matchedRest = cloudRestrictions[uid];
                        break;
                    }
                }
            }

            const bannedScreen = document.getElementById('bannedScreen');
            const noticeBox = document.getElementById('mutedNoticeBox');
            const activeControls = document.getElementById('activeInputControls');

            if (restrictionCountdownInterval) {
                clearInterval(restrictionCountdownInterval);
                restrictionCountdownInterval = null;
            }

            if (!matchedRest) {
                bannedScreen.classList.add('hidden');
                noticeBox.classList.add('hidden');
                activeControls.classList.remove('hidden');
                return;
            }

            if (matchedRest.kicked) {
                alert("Byl jsi vyhozen!");
                handleLogout();
                return;
            }

            if (matchedRest.ban) {
                const ban = matchedRest.ban;
                if (ban.permanent || Date.now() < ban.expiresAt) {
                    document.getElementById('bannedReasonText').innerText = ban.reason || 'Bez důvodu';
                    document.getElementById('bannedDurationText').innerText = ban.permanent ? 'Natrvalo' : `Do ${new Date(ban.expiresAt).toLocaleString()}`;
                    
                    const countdownContainer = document.getElementById('bannedCountdownContainer');
                    const countdownTimer = document.getElementById('bannedCountdownTimer');

                    if (!ban.permanent && ban.expiresAt) {
                        countdownContainer.classList.remove('hidden');
                        restrictionCountdownInterval = setInterval(() => {
                            const remaining = ban.expiresAt - Date.now();
                            if (remaining <= 0) {
                                clearInterval(restrictionCountdownInterval);
                                location.reload();
                                return;
                            }
                            const mins = Math.floor(remaining / 60000);
                            const secs = Math.floor((remaining % 60000) / 1000);
                            countdownTimer.innerText = `${mins}m ${secs}s`;
                        }, 1000);
                    } else {
                        countdownContainer.classList.add('hidden');
                    }

                    bannedScreen.classList.remove('hidden');
                    bannedScreen.classList.add('flex');
                    return;
                }
            }
            bannedScreen.classList.add('hidden');

            const noticeText = document.getElementById('mutedNoticeText');
            const mutedCountdownContainer = document.getElementById('mutedCountdownContainer');
            const mutedCountdownTimer = document.getElementById('mutedCountdownTimer');

            if (matchedRest.mute) {
                if (matchedRest.mute.permanent) {
                    noticeText.innerText = `Ztlumen natrvalo.`;
                    mutedCountdownContainer.classList.add('hidden');
                    noticeBox.classList.remove('hidden');
                    activeControls.classList.add('hidden');
                } else if (Date.now() < matchedRest.mute.expiresAt) {
                    noticeText.innerText = `Jsi ztlumen.`;
                    mutedCountdownContainer.classList.remove('hidden');

                    restrictionCountdownInterval = setInterval(() => {
                        const remaining = matchedRest.mute.expiresAt - Date.now();
                        if (remaining <= 0) {
                            clearInterval(restrictionCountdownInterval);
                            db.ref('restrictions/' + (matchedRest.userId || currentUserId) + '/mute').remove();
                            location.reload();
                            return;
                        }
                        const mins = Math.floor(remaining / 60000);
                        const secs = Math.floor((remaining % 60000) / 1000);
                        mutedCountdownTimer.innerText = `${mins}m ${secs}s`;
                    }, 1000);

                    noticeBox.classList.remove('hidden');
                    activeControls.classList.add('hidden');
                } else {
                    db.ref('restrictions/' + (matchedRest.userId || currentUserId) + '/mute').remove();
                    noticeBox.classList.add('hidden');
                    activeControls.classList.remove('hidden');
                }
            } else {
                noticeBox.classList.add('hidden');
                activeControls.classList.remove('hidden');
            }
        }

        const emojiPopup = document.getElementById('emojiPickerPopup');
        const imageSourcePopup = document.getElementById('imageSourcePopup');

        function toggleMemePicker() {
            imageSourcePopup.classList.add('hidden');
            emojiPopup.classList.toggle('hidden');
            if (!emojiPopup.classList.contains('hidden')) renderEmojiPickerList();
        }

        function toggleImageSourceMenu() {
            emojiPopup.classList.add('hidden');
            imageSourcePopup.classList.toggle('hidden');
        }

        function triggerFileInput(isCamera) {
            imageSourcePopup.classList.add('hidden');
            if (isCamera) document.getElementById('imageInputCamera').click();
            else document.getElementById('imageInputGallery').click();
        }

        function renderEmojiPickerList() {
            const content = document.getElementById('emojiPickerContent');
            content.innerHTML = '';
            if (cloudEmojis.length === 0) {
                content.innerHTML = '<span class="text-zinc-600">Žádné memy</span>';
                return;
            }
            cloudEmojis.forEach(imgSrc => {
                const img = document.createElement('img');
                img.src = imgSrc;
                img.className = "w-6 h-6 object-contain cursor-pointer border border-zinc-800 bg-black p-0.5";
                img.onclick = () => {
                    insertEmojiIntoMessage(imgSrc);
                    emojiPopup.classList.add('hidden');
                };
                content.appendChild(img);
            });
        }

        chatContainer.addEventListener('scroll', () => {
            const threshold = 80;
            isUserAtBottom = chatContainer.scrollHeight - (chatContainer.scrollTop + chatContainer.clientHeight) <= threshold;
            if (!isUserAtBottom) scrollToBottomBtn.classList.remove('opacity-0', 'pointer-events-none');
            else scrollToBottomBtn.classList.add('opacity-0', 'pointer-events-none');
        });

        function scrollToBottom(smooth = false) {
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
            scrollToBottomBtn.classList.add('opacity-0', 'pointer-events-none');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname;
            if (path.includes('admin')) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminPageScreen').classList.remove('hidden');
                document.getElementById('adminPageScreen').classList.add('flex');
                if (sessionStorage.getItem('gjw_admin_logged') === 'true') {
                    document.getElementById('adminAuthBox').classList.add('hidden');
                    document.getElementById('adminDashboardBox').classList.remove('hidden');
                    showAdminDashboard();
                }
                return;
            }

            if (currentUser && currentUserId) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('userSubtitle').innerText = currentUser;
                renderMessages();
                scrollToBottom(false);
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
            }
        });

        function handleLogoClick() {
            logoClicks++;
            clearTimeout(logoClickTimer);
            if (logoClicks >= 3) {
                logoClicks = 0;
                window.location.href = './admin';
            } else {
                logoClickTimer = setTimeout(() => { logoClicks = 0; }, 600);
            }
        }

        function openAdminModalFromChat() {
            window.location.href = './admin';
        }

        function verifyAdminPassword() {
            if (document.getElementById('adminPasswordInput').value === '69_atillo_69') {
                sessionStorage.setItem('gjw_admin_logged', 'true');
                document.getElementById('adminAuthBox').classList.add('hidden');
                document.getElementById('adminDashboardBox').classList.remove('hidden');
                showAdminDashboard();
            } else {
                document.getElementById('adminLoginError').classList.remove('hidden');
            }
        }

        function showAdminDashboard() {
            renderAdminUsersList();
            renderAdminBansLog();
            renderAdminImageLog();
            renderAdminEmojis();
            renderAdminLogs();
        }

        function renderAdminUsersList() {
            const container = document.getElementById('adminUsersListContainer');
            const searchVal = (document.getElementById('adminUserSearchInput')?.value || '').toLowerCase().trim();
            container.innerHTML = '';

            const audit = getStorageAuditLog();
            const activeUsersMap = {};
            audit.forEach(item => {
                if (item.userId && item.user && item.user !== 'admin') {
                    activeUsersMap[item.userId] = { userId: item.userId, fingerprint: item.fingerprint || deviceFingerprint, name: item.user, ip: item.publicIp || 'N/A' };
                }
            });

            let users = Object.values(activeUsersMap);
            if (searchVal) users = users.filter(u => u.name.toLowerCase().includes(searchVal) || u.userId.toLowerCase().includes(searchVal));

            if (users.length === 0) {
                container.innerHTML = '<span class="text-zinc-600">Žádní uživatelé</span>';
                return;
            }

            users.forEach(u => {
                const rest = cloudRestrictions[u.userId] || {};
                const isBanned = rest.ban && (rest.ban.permanent || Date.now() < rest.ban.expiresAt);
                const isMuted = rest.mute && (rest.mute.permanent || Date.now() < rest.mute.expiresAt);

                const row = document.createElement('div');
                row.className = "flex justify-between items-center bg-zinc-950 border border-zinc-900 p-1.5 gap-1";
                row.innerHTML = `
                    <div>
                        <div>${u.name} ${isBanned ? '<span class="text-red-500">[BAN]</span>' : ''} ${isMuted ? '<span class="text-orange-500">[MUTE]</span>' : ''}</div>
                        <div class="text-[9px] text-zinc-600">ID: ${u.userId} | IP: ${u.ip}</div>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="adminChangeNickname('${u.userId}', '${u.name}')" class="border border-zinc-700 px-1 cursor-pointer">Jméno</button>
                        <button onclick="kickUserDirect('${u.userId}', '${u.name}', '${u.fingerprint}')" class="border border-yellow-800 text-yellow-400 px-1 cursor-pointer">Kick</button>
                        <button onclick="promptMuteUser('${u.userId}', '${u.name}', '${u.fingerprint}')" class="border border-orange-800 text-orange-400 px-1 cursor-pointer">Mute</button>
                        <button onclick="promptBanUser('${u.userId}', '${u.name}', '${u.fingerprint}')" class="border border-red-800 text-red-400 px-1 cursor-pointer">Ban</button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function renderAdminBansLog() {
            const container = document.getElementById('adminBansLogContainer');
            container.innerHTML = '';
            let count = 0;
            for (let uid in cloudRestrictions) {
                const rest = cloudRestrictions[uid];
                if (rest.ban && (rest.ban.permanent || Date.now() < rest.ban.expiresAt)) {
                    count++;
                    const ban = rest.ban;
                    const row = document.createElement('div');
                    row.className = "border border-zinc-900 p-1 bg-black";
                    row.innerHTML = `<span class="text-red-400">${ban.username}</span>: ${ban.reason || 'Bez důvodu'}`;
                    container.appendChild(row);
                }
            }
            if (count === 0) container.innerHTML = '<span class="text-zinc-600">Žádné bany</span>';
        }

        function renderAdminImageLog() {
            const container = document.getElementById('adminImageLogContainer');
            container.innerHTML = '';
            const imgs = cloudMessages.filter(m => m.image);
            if (imgs.length === 0) {
                container.innerHTML = '<span class="text-zinc-600">Žádné obrázky</span>';
                return;
            }
            imgs.reverse().forEach(msg => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between border border-zinc-900 p-1 bg-black";
                row.innerHTML = `
                    <div class="flex items-center gap-2">
                        <img src="${msg.image}" class="w-6 h-6 object-cover border border-zinc-800 cursor-pointer" onclick="openLightbox('${msg.image}')">
                        <span>${msg.user}</span>
                    </div>
                    <button onclick="deleteMessage('${msg.id}')" class="text-red-400 cursor-pointer">Smazat</button>
                `;
                container.appendChild(row);
            });
        }

        function renderAdminLogs() {
            const container = document.getElementById('adminLogContainer');
            const audit = getStorageAuditLog();
            container.innerHTML = '';
            if (audit.length === 0) {
                container.innerHTML = 'Žádné logy';
                return;
            }
            [...audit].reverse().forEach(item => {
                const div = document.createElement('div');
                div.className = "border-b border-zinc-900 pb-0.5 mb-0.5 text-zinc-500";
                div.innerHTML = `[${item.action}] ${item.user || 'N/A'} - IP: ${item.publicIp || 'N/A'}`;
                container.appendChild(div);
            });
        }

        function adminChangeNickname(targetUid, oldName) {
            const newName = prompt("Nové jméno:", oldName);
            if (!newName || !newName.trim()) return;
            db.ref('messages').once('value', (snapshot) => {
                const val = snapshot.val();
                if (!val) return;
                for (let key in val) {
                    if (val[key].userId === targetUid) db.ref('messages/' + key).update({ user: newName.trim() });
                }
            });
            alert("Změněno");
            showAdminDashboard();
        }

        function kickUserDirect(targetUid, username, userFp) {
            db.ref('restrictions/' + targetUid).update({ kicked: true, fingerprint: userFp });
            alert("Vyhozen");
            showAdminDashboard();
        }

        function promptMuteUser(targetUid, username, userFp) {
            const mins = prompt("Mute v minutách (0 pro zrušení):");
            if (mins === null) return;
            if (mins === '0') {
                db.ref('restrictions/' + targetUid + '/mute').remove();
                showAdminDashboard();
                return;
            }
            const ms = parseInt(mins) * 60 * 1000;
            db.ref('restrictions/' + targetUid).update({ mute: { permanent: false, expiresAt: Date.now() + ms }, fingerprint: userFp, userId: targetUid });
            alert("Ztlumen");
            showAdminDashboard();
        }

        function promptBanUser(targetUid, username, userFp) {
            const mins = prompt("Ban v minutách (0 pro zrušení):");
            if (mins === null) return;
            if (mins === '0') {
                db.ref('restrictions/' + targetUid + '/ban').remove();
                showAdminDashboard();
                return;
            }
            const reason = prompt("Důvod:") || "Porušení pravidel";
            const ms = parseInt(mins) * 60 * 1000;
            db.ref('restrictions/' + targetUid).update({ ban: { permanent: false, expiresAt: Date.now() + ms, reason, username }, fingerprint: userFp, userId: targetUid });
            alert("Zabanován");
            showAdminDashboard();
        }

        function openUserProfileModal(uid, username) {
            if (!isAdmin) return;
            activeProfileUserId = uid;
            document.getElementById('profileUsernameTitle').innerText = username;
            document.getElementById('profileUserIdSub').innerText = uid;
            renderUserProfileModalContent(uid);
            document.getElementById('userProfileModal').classList.remove('hidden');
        }

        function closeUserProfileModal() {
            activeProfileUserId = null;
            document.getElementById('userProfileModal').classList.add('hidden');
        }

        function renderUserProfileModalContent(uid) {
            const container = document.getElementById('profileUserMessagesList');
            container.innerHTML = '';
            const userMsgs = cloudMessages.filter(m => m.userId === uid && !m.isSystem);
            userMsgs.reverse().forEach(msg => {
                const row = document.createElement('div');
                row.className = "border border-zinc-900 p-1 bg-black space-y-1";
                row.innerHTML = `<div class="flex justify-between text-[9px] text-zinc-500"><span>${msg.time}</span><button onclick="deleteMessage('${msg.id}')" class="text-red-400 cursor-pointer">Smazat</button></div><div>${msg.text || ''}</div>`;
                container.appendChild(row);
            });
        }

        function handleAdminUploadEmoji(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) { db.ref('emojis').push(e.target.result); alert("Nahráno"); showAdminDashboard(); };
            reader.readAsDataURL(file);
        }

        function renderAdminEmojis() {
            const list = document.getElementById('adminEmojiList');
            list.innerHTML = '';
            cloudEmojis.forEach((img, idx) => {
                const wrap = document.createElement('div');
                wrap.className = "relative border border-zinc-800 p-0.5 bg-black";
                wrap.innerHTML = `<img src="${img}" class="w-6 h-6 object-contain"><button onclick="deleteEmoji(${idx})" class="absolute -top-1 -right-1 bg-red-600 text-white rounded-full w-3 h-3 text-[8px] flex items-center justify-center cursor-pointer">&times;</button>`;
                list.appendChild(wrap);
            });
        }

        function deleteEmoji(idx) {
            db.ref('emojis').once('value', s => {
                const val = s.val();
                if (val) {
                    const keys = Object.keys(val);
                    if (keys[idx]) { db.ref('emojis/' + keys[idx]).remove(); showAdminDashboard(); }
                }
            });
        }

        function insertEmojiIntoMessage(imgSrc) {
            const input = document.getElementById('messageInput');
            input.value += ` [meme:${imgSrc}] `;
            input.focus();
        }

        function parseMessageText(text) {
            if (!text) return '';
            let formatted = text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" class="underline text-blue-400">$1</a>');
            return formatted.replace(/\[meme:(data:image\/[^\]]+)\]/g, '<img src="$1" class="inline-block w-5 h-5 object-contain align-middle mx-0.5 cursor-pointer" onclick="openLightbox(\'$1\')">');
        }

        function openLightbox(img) {
            document.getElementById('lightboxImg').src = img;
            document.getElementById('imageLightbox').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('imageLightbox').classList.add('hidden');
        }

        function openChatFromAdmin() {
            const mode = document.getElementById('adminModeSelect').value;
            currentUser = 'admin (Admin)';
            currentUserId = 'admin_uid';
            isAdmin = true;
            document.getElementById('adminPageScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('userSubtitle').innerText = 'admin (Admin)';
            document.getElementById('adminHeaderBtn').classList.remove('hidden');
            renderMessages();
            scrollToBottom(false);
        }

        function handleLogin() {
            const nick = document.getElementById('loginNickname').value.trim();
            const cls = document.getElementById('loginClass').value;
            const err = document.getElementById('loginError');

            if (!nick) { err.innerText = "Zadej přezdívku"; err.classList.remove('hidden'); return; }
            if (nick.toLowerCase() === 'admin') { err.innerText = "Zakázané jméno"; err.classList.remove('hidden'); return; }

            if (!currentUserId) currentUserId = 'user_' + Math.random().toString(36).substring(2, 9);
            currentUser = nick + (cls ? ' (' + cls + ')' : '');

            let isBanned = false;
            const userRest = cloudRestrictions[currentUserId];
            if (userRest && userRest.ban && (userRest.ban.permanent || Date.now() < userRest.ban.expiresAt)) isBanned = true;

            if (isBanned) {
                document.getElementById('bannedReasonText').innerText = userRest.ban.reason || '-';
                document.getElementById('bannedDurationText').innerText = 'Aktivní ban';
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('bannedScreen').classList.remove('hidden');
                document.getElementById('bannedScreen').classList.add('flex');
                return;
            }

            isAdmin = false;
            localStorage.setItem('gjw_saved_user', currentUser);
            localStorage.setItem('gjw_saved_user_id', currentUserId);

            const audit = getStorageAuditLog();
            audit.push({ action: 'USER_LOGIN', userId: currentUserId, fingerprint: deviceFingerprint, user: currentUser, publicIp: clientPublicIp, time: new Date().toLocaleString() });
            saveStorageAuditLog(audit);

            db.ref('messages').push({
                id: 'msg_' + Date.now(),
                userId: currentUserId,
                user: 'Systém',
                text: `${currentUser} se připojil`,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                isSystem: true
            });

            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('userSubtitle').innerText = currentUser;
            renderMessages();
            scrollToBottom(false);
        }

        function handleLogout() {
            localStorage.removeItem('gjw_saved_user');
            localStorage.removeItem('gjw_saved_user_id');
            sessionStorage.removeItem('gjw_admin_logged');
            location.href = './';
        }

        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedImageBase64 = e.target.result;
                document.getElementById('imagePreview').src = selectedImageBase64;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function clearImagePreview() {
            selectedImageBase64 = null;
            document.getElementById('imageInputGallery').value = '';
            document.getElementById('imageInputCamera').value = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text && !selectedImageBase64) return;

            const t = text;
            const img = selectedImageBase64;
            input.value = '';
            clearImagePreview();

            db.ref('messages').push({
                id: 'msg_' + Date.now(),
                userId: currentUserId,
                user: currentUser,
                isAdmin: isAdmin,
                text: t,
                image: img,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                edited: false
            });

            renderMessages();
            scrollToBottom(true);
        }

        function renderMessages() {
            messagesList.innerHTML = '';
            if (cloudMessages.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            cloudMessages.forEach(msg => {
                const div = document.createElement('div');
                if (msg.isSystem) {
                    div.className = "text-center my-1 text-zinc-600 text-[10px]";
                    div.innerText = `-- ${msg.text} --`;
                    messagesList.appendChild(div);
                    return;
                }

                const isAuthor = currentUserId && msg.userId === currentUserId;
                div.className = `flex flex-col space-y-0.5 ${isAuthor ? 'items-end' : 'items-start'} my-1.5`;

                const meta = document.createElement('div');
                meta.className = "text-[10px] text-zinc-500 px-0.5 flex gap-1.5 items-center";
                
                const nameSpan = document.createElement('span');
                if (msg.isAdmin) {
                    nameSpan.className = "rainbow-admin text-xs font-bold";
                    nameSpan.innerText = msg.user;
                } else {
                    nameSpan.className = "text-zinc-400";
                    nameSpan.innerText = msg.user;
                    if (isAdmin) {
                        nameSpan.className += " cursor-pointer underline text-blue-400";
                        nameSpan.onclick = () => openUserProfileModal(msg.userId, msg.user);
                    }
                }
                meta.appendChild(nameSpan);

                const timeSpan = document.createElement('span');
                timeSpan.className = "text-[9px] text-zinc-600";
                timeSpan.innerText = msg.time + (msg.edited ? ' (upraveno)' : '');
                meta.appendChild(timeSpan);
                div.appendChild(meta);

                const box = document.createElement('div');
                box.className = `max-w-md border border-zinc-900 p-2 ${isAuthor ? 'bg-zinc-900 text-white' : 'bg-black text-zinc-300'}`;
                if (msg.text) {
                    const txt = document.createElement('div');
                    txt.className = "whitespace-pre-wrap break-words";
                    txt.innerHTML = parseMessageText(msg.text);
                    box.appendChild(txt);
                }
                if (msg.image) {
                    const image = document.createElement('img');
                    image.src = msg.image;
                    image.className = "mt-1 rounded max-h-40 object-cover cursor-pointer border border-zinc-800";
                    image.onclick = () => openLightbox(msg.image);
                    box.appendChild(image);
                }
                div.appendChild(box);

                const actions = document.createElement('div');
                actions.className = "text-[9px] text-zinc-600 px-0.5 flex gap-2";
                if (isAuthor || isAdmin) {
                    const del = document.createElement('button');
                    del.innerText = "Smazat";
                    del.className = "hover:text-red-400 cursor-pointer";
                    del.onclick = () => deleteMessage(msg.id);
                    actions.appendChild(del);
                }
                div.appendChild(actions);

                messagesList.appendChild(div);
            });

            if (isUserAtBottom) scrollToBottom(false);
        }

        function deleteMessage(id) {
            db.ref('messages').once('value', s => {
                const val = s.val();
                if (!val) return;
                for (let key in val) {
                    if (val[key].id === id) db.ref('messages/' + key).remove();
                }
            });
        }

        function clearChatData() {
            if (!confirm("Smazat celou historii a restrikce?")) return;
            db.ref('messages').remove();
            db.ref('restrictions').remove();
            showAdminDashboard();
        }
    </script>
</body>
</html>
